<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Development – Admin | CodeCureBD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }
    .dev-layout { display: grid; grid-template-columns: 280px 1fr 340px; min-height: 100vh; }
    @media (max-width: 1100px) {
      .dev-layout { grid-template-columns: 1fr; }
      .dev-sidebar, .dev-chat-col { max-height: 360px; }
    }
    .dev-sidebar {
      background: #111827; border-right: 1px solid #1e293b; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto;
    }
    .dev-main { padding: 1rem 1.25rem; overflow-y: auto; background: #0b1220; }
    .dev-chat-col {
      background: #111827; border-left: 1px solid #1e293b;
      display: flex; flex-direction: column; min-height: 0;
    }
    .panel {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 1rem;
    }
    .panel h3 { margin: 0 0 0.75rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; }
    .file-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 10px; cursor: pointer; font-size: 0.85rem; color: #cbd5e1;
    }
    .file-row:hover, .file-row.active { background: #334155; color: #fff; }
    .file-row .actions { margin-left: auto; display: flex; gap: 4px; opacity: 0.7; }
    .file-row .actions button {
      background: none; border: none; color: #94a3b8; cursor: pointer; padding: 2px 6px; border-radius: 6px;
    }
    .file-row .actions button:hover { color: #fff; background: #475569; }
    .editor-area {
      width: 100%; min-height: 360px; background: #020617; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 12px; padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem; line-height: 1.5; resize: vertical; outline: none;
    }
    .btn-dev {
      background: linear-gradient(135deg, #0066FF, #8B5CF6); color: #fff; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-dev:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      background: #334155; color: #e2e8f0; border: none; padding: 8px 12px;
      border-radius: 10px; font-size: 0.85rem; cursor: pointer;
    }
    .btn-ghost:hover { background: #475569; }
    .progress-slider { width: 100%; accent-color: #0066FF; }
    .chat-body {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px;
      background: #0f172a; min-height: 200px;
    }
    .c-row { display: flex; flex-direction: column; width: fit-content; max-width: 90%; }
    .c-row.sent { align-self: flex-end; align-items: flex-end; }
    .c-row.recv { align-self: flex-start; }
    .c-bubble {
      padding: 8px 11px; border-radius: 12px; font-size: 0.85rem; white-space: pre-wrap;
      word-break: normal; overflow-wrap: break-word;
    }
    .c-row.sent .c-bubble { background: linear-gradient(135deg, #0066FF, #5856D6); color: #fff; }
    .c-row.recv .c-bubble { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .c-time { font-size: 0.6rem; color: #64748b; margin-top: 2px; }
    .chat-foot {
      padding: 10px; border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: flex-end;
    }
    .chat-foot textarea {
      flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      color: #e2e8f0; padding: 8px 10px; font-size: 0.85rem; resize: none; min-height: 40px;
      max-height: 90px; outline: none; font-family: inherit;
    }
    .gate {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .gate-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 2rem;
      max-width: 400px; width: 100%; text-align: center;
    }
    .msg-img { max-width: 180px; border-radius: 8px; display: block; margin-bottom: 4px; }
    .topbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .badge-soft {
      background: #334155; color: #94a3b8; font-size: 0.75rem; padding: 4px 10px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="adminGate" class="gate">
    <div class="gate-card">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#0066FF,#8B5CF6);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
        <i class="fas fa-shield-alt text-white text-xl"></i>
      </div>
      <h2 class="text-xl font-bold text-white mb-1" id="gateTitle">Verifying access…</h2>
      <p id="gateStatus" class="text-sm text-slate-400">Please wait</p>
      <div id="gateDenied" class="hidden mt-4">
        <p class="text-red-400 text-sm mb-3">Access denied. Admin only.</p>
        <a href="admin-login.html" class="btn-dev" style="display:inline-flex;">Admin Login</a>
        <a href="admin-panel.html" class="btn-ghost" style="display:inline-flex;margin-left:8px;">Panel</a>
      </div>
    </div>
  </div>

  <div id="devApp" class="dev-layout" style="display:none;">
    <aside class="dev-sidebar">
      <div class="flex items-center justify-between gap-2">
        <strong class="text-white text-sm">Project files</strong>
        <a href="admin-panel.html" class="btn-ghost text-xs" style="padding:4px 8px;">Panel</a>
      </div>
      <p class="text-xs text-slate-500" id="sidebarOrderMeta">Order —</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="btn-dev text-xs" id="btnNewFile"><i class="fas fa-plus"></i> New</button>
        <label class="btn-ghost text-xs cursor-pointer" style="display:inline-flex;align-items:center;gap:6px;">
          <i class="fas fa-upload"></i> Upload
          <input type="file" id="uploadMulti" multiple accept=".html,.htm,.css,.js,.json,.txt,.svg,.md" hidden />
        </label>
      </div>
      <div id="fileList" class="flex-1 overflow-y-auto space-y-1 mt-2"></div>
      <p class="text-xs text-slate-500">Files stored as text in Firestore. User previews via Visit Site.</p>
    </aside>

    <main class="dev-main">
      <div class="topbar">
        <div>
          <h1 class="text-lg font-bold text-white m-0" id="pageTitle">Development</h1>
          <span class="badge-soft" id="activeFileName">No file selected</span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="btn-dev" id="btnSaveFile" disabled><i class="fas fa-save"></i> Save</button>
          <button type="button" class="btn-ghost" id="btnPreview"><i class="fas fa-eye"></i> Preview</button>
        </div>
      </div>

      <div class="panel mb-4">
        <h3>Progress (visible to customer)</h3>
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[160px]">
            <label class="text-xs text-slate-400">Percent: <strong id="pctLabel">0</strong>%</label>
            <input type="range" min="0" max="100" value="0" class="progress-slider" id="progressRange" />
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Status label</label>
            <input type="text" id="progressStatus" style="background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px;padding:8px 12px;min-height:40px;" placeholder="e.g. Designing homepage" />
          </div>
        </div>
        <label class="text-xs text-slate-400 block mt-2 mb-1">Note to customer</label>
        <textarea id="progressNote" rows="2" style="width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px;padding:8px 12px;" placeholder="Short update for the customer…"></textarea>
        <button type="button" class="btn-dev mt-2" id="btnSaveProgress"><i class="fas fa-check"></i> Update progress</button>
      </div>

      <div class="panel">
        <h3>File editor</h3>
        <div class="flex flex-wrap gap-2 mb-2">
          <input type="text" id="filePathInput" style="flex:1;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px;padding:8px 12px;min-height:40px;" placeholder="path e.g. index.html" />
        </div>
        <textarea id="fileEditor" class="editor-area" placeholder="Select or create a file…" spellcheck="false"></textarea>
      </div>
    </main>

    <section class="dev-chat-col">
      <div style="padding:12px 14px;border-bottom:1px solid #1e293b;">
        <div class="font-semibold text-white text-sm"><i class="fas fa-comments mr-1"></i> Customer chat</div>
        <div class="text-xs text-slate-400" id="chatUserLabel">User</div>
      </div>
      <div class="chat-body" id="chatBody"><div class="text-center text-slate-500 text-sm py-6">Loading…</div></div>
      <div class="chat-foot">
        <label class="btn-ghost" style="padding:8px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <i class="fas fa-image"></i>
          <input type="file" id="chatImage" accept="image/*" hidden />
        </label>
        <textarea id="chatInput" rows="1" placeholder="Reply as developer…"></textarea>
        <button type="button" class="btn-dev" id="chatSend" style="border-radius:50%;width:40px;height:40px;padding:0;justify-content:center;"><i class="fas fa-paper-plane"></i></button>
      </div>
    </section>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import {
      auth, db, doc, getDoc, updateDoc, deleteDoc, collection, query, where,
      onSnapshot, addDoc, serverTimestamp, onAuthStateChanged
    } from './firebase-config.js';

    window.showToast = (message, type = 'success') => {
      let c = document.getElementById('toast-container');
      if (!c) { c = document.createElement('div'); c.id = 'toast-container'; document.body.appendChild(c); }
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
      c.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    };

    async function uploadImage(file) {
      const mod = await import('./components.js');
      return mod.uploadImage(file);
    }

    const orderId = new URLSearchParams(window.location.search).get('id') || '';
    let adminUser = null;
    let orderData = null;
    let files = [];
    let activeFileId = null;
    let unsubFiles = null;
    let unsubChat = null;
    let pendingChatImage = null;

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function isImageUrl(str) {
      if (!str) return false;
      const t = String(str).trim();
      return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(t) || t.includes('res.cloudinary.com');
    }

    function showApp() {
      document.getElementById('adminGate').style.display = 'none';
      document.getElementById('devApp').style.display = 'grid';
    }

    function showDenied(msg) {
      document.getElementById('gateTitle').textContent = 'Access denied';
      document.getElementById('gateStatus').textContent = msg || 'Admin only.';
      document.getElementById('gateDenied').classList.remove('hidden');
      document.getElementById('devApp').style.display = 'none';
    }

    function renderFileList() {
      const el = document.getElementById('fileList');
      if (!files.length) {
        el.innerHTML = '<p class="text-xs text-slate-500 px-2">No files yet. Create index.html for Visit Site.</p>';
        return;
      }
      el.innerHTML = files.map(f => `
        <div class="file-row ${f.id === activeFileId ? 'active' : ''}" data-id="${f.id}">
          <i class="fas fa-file-code text-blue-400"></i>
          <span class="truncate flex-1">${escapeHtml(f.path || f.fileName)}</span>
          <div class="actions">
            <button type="button" data-del="${f.id}" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
      el.querySelectorAll('.file-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('[data-del]')) return;
          openFile(row.dataset.id);
        });
      });
      el.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this file?')) return;
          try {
            await deleteDoc(doc(db, 'devFiles', btn.dataset.del));
            showToast('Deleted', 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
    }

    function openFile(id) {
      const f = files.find(x => x.id === id);
      if (!f) return;
      activeFileId = id;
      document.getElementById('filePathInput').value = f.path || f.fileName || '';
      document.getElementById('fileEditor').value = f.content || '';
      document.getElementById('activeFileName').textContent = f.path || f.fileName || 'file';
      document.getElementById('btnSaveFile').disabled = false;
      renderFileList();
    }

    function listenFiles() {
      if (!orderId) return;
      if (unsubFiles) try { unsubFiles(); } catch (_) {}
      const q = query(collection(db, 'devFiles'), where('orderId', '==', orderId));
      unsubFiles = onSnapshot(q, (snap) => {
        files = [];
        snap.forEach(d => files.push({ id: d.id, ...d.data() }));
        files.sort((a, b) => (a.path || a.fileName || '').localeCompare(b.path || b.fileName || ''));
        renderFileList();
        if (activeFileId && !files.find(f => f.id === activeFileId)) {
          activeFileId = null;
          document.getElementById('fileEditor').value = '';
          document.getElementById('btnSaveFile').disabled = true;
          document.getElementById('activeFileName').textContent = 'No file selected';
        }
      }, (err) => console.warn('files listener', err));
    }

    function renderChat(msgs) {
      const body = document.getElementById('chatBody');
      if (!msgs.length) {
        body.innerHTML = '<div class="text-center text-slate-500 text-sm py-6">No messages yet</div>';
        return;
      }
      let html = '';
      msgs.forEach(m => {
        const isDev = m.fromUserId === 'developer' || m.fromUserId === adminUser?.uid;
        const ts = m.timestamp?.toDate?.();
        const time = ts ? ts.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
        const raw = String(m.content || '');
        const lines = raw.split('\n');
        let text = [], img = null;
        lines.forEach(l => {
          const t = l.trim();
          if (isImageUrl(t)) img = t;
          else if (t) text.push(l);
        });
        if (!img && isImageUrl(raw.trim())) { img = raw.trim(); text = []; }
        let content = '';
        if (img) content += `<img class="msg-img" src="${escapeHtml(img)}" alt="" />`;
        if (text.length) content += escapeHtml(text.join('\n'));
        html += `<div class="c-row ${isDev ? 'sent' : 'recv'}"><div class="c-bubble">${content || '(empty)'}</div><div class="c-time">${time}</div></div>`;
      });
      body.innerHTML = html;
      body.scrollTop = body.scrollHeight;
    }

    function listenChat() {
      if (!orderId) return;
      if (unsubChat) try { unsubChat(); } catch (_) {}
      const q = query(collection(db, 'devMessages'), where('orderId', '==', orderId));
      unsubChat = onSnapshot(q, (snap) => {
        const msgs = [];
        snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
        msgs.sort((a, b) => (a.timestamp?.toDate?.()?.getTime() || 0) - (b.timestamp?.toDate?.()?.getTime() || 0));
        renderChat(msgs);
      }, (err) => {
        document.getElementById('chatBody').innerHTML =
          `<div class="text-red-400 text-sm p-3">${escapeHtml(err.message)}</div>`;
      });
    }

    async function loadOrderData() {
      if (!orderId) {
        document.getElementById('sidebarOrderMeta').textContent = 'No order id in URL';
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'orders', orderId));
        if (!snap.exists()) {
          document.getElementById('sidebarOrderMeta').textContent = 'Order not found';
          return;
        }
        orderData = { id: snap.id, ...snap.data() };
        document.getElementById('pageTitle').textContent = `Dev · #${orderId.slice(0, 8).toUpperCase()}`;
        document.getElementById('sidebarOrderMeta').textContent =
          `Order #${orderId.slice(0, 8).toUpperCase()} · ${orderData.status || 'pending'}`;
        document.getElementById('progressRange').value = Number(orderData.progressPercent) || 0;
        document.getElementById('pctLabel').textContent = String(Number(orderData.progressPercent) || 0);
        document.getElementById('progressStatus').value = orderData.progressStatus || '';
        document.getElementById('progressNote').value = orderData.progressNote || '';
        document.getElementById('chatUserLabel').textContent =
          orderData.userEmail || orderData.userId || 'User';
        if (orderData.userId) {
          getDoc(doc(db, 'users', orderData.userId)).then((u) => {
            if (u.exists()) {
              const n = u.data().displayName || u.data().email;
              if (n) document.getElementById('chatUserLabel').textContent = n;
            }
          }).catch(() => {});
        }
      } catch (err) {
        console.error(err);
        document.getElementById('sidebarOrderMeta').textContent =
          'Could not load order: ' + (err.message || '');
      }
    }

    document.getElementById('btnNewFile')?.addEventListener('click', async () => {
      const path = prompt('File path (e.g. index.html)', 'index.html');
      if (!path || !orderId) return;
      const name = path.split('/').pop();
      try {
        const ref = await addDoc(collection(db, 'devFiles'), {
          orderId,
          fileName: name,
          path,
          content: /index\.html?/i.test(name)
            ? `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
</head>
<body>
  <h1>Hello from CodeCureBD</h1>
</body>
</html>`
            : '',
          updatedAt: serverTimestamp(),
          uploadedBy: adminUser?.uid || 'admin'
        });
        activeFileId = ref.id;
        showToast('File created', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('btnSaveFile')?.addEventListener('click', async () => {
      if (!activeFileId) return;
      const path = document.getElementById('filePathInput').value.trim() || 'file.txt';
      const content = document.getElementById('fileEditor').value;
      const name = path.split('/').pop();
      try {
        await updateDoc(doc(db, 'devFiles', activeFileId), {
          path, fileName: name, content, updatedAt: serverTimestamp()
        });
        if (/index\.html?/i.test(name) && orderId) {
          await updateDoc(doc(db, 'orders', orderId), { previewReady: true, updatedAt: serverTimestamp() });
        }
        showToast('Saved', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('uploadMulti')?.addEventListener('change', async (e) => {
      const list = Array.from(e.target.files || []);
      if (!list.length || !orderId) return;
      for (const file of list) {
        try {
          const content = await file.text();
          await addDoc(collection(db, 'devFiles'), {
            orderId,
            fileName: file.name,
            path: file.name,
            content,
            updatedAt: serverTimestamp(),
            uploadedBy: adminUser?.uid || 'admin',
            size: file.size
          });
        } catch (err) {
          showToast(file.name + ': ' + err.message, 'error');
        }
      }
      e.target.value = '';
      showToast('Upload finished', 'success');
    });

    document.getElementById('progressRange')?.addEventListener('input', (e) => {
      document.getElementById('pctLabel').textContent = e.target.value;
    });

    document.getElementById('btnSaveProgress')?.addEventListener('click', async () => {
      if (!orderId) return;
      try {
        await updateDoc(doc(db, 'orders', orderId), {
          progressPercent: Number(document.getElementById('progressRange').value) || 0,
          progressStatus: document.getElementById('progressStatus').value.trim(),
          progressNote: document.getElementById('progressNote').value.trim(),
          developmentActive: true,
          updatedAt: serverTimestamp()
        });
        showToast('Progress updated', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    document.getElementById('btnPreview')?.addEventListener('click', () => {
      const byName = {};
      files.forEach(f => { byName[f.path || f.fileName] = f.content || ''; });
      let key = Object.keys(byName).find(k => /(^|\/)index\.html?$/i.test(k));
      if (!key) key = Object.keys(byName).find(k => /\.html?$/i.test(k));
      if (!key) { showToast('No HTML file', 'warning'); return; }
      let html = byName[key];
      if (!/<html/i.test(html)) {
        html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${html}</body></html>`;
      }
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const text = (input.value || '').trim();
      if (!text && !pendingChatImage) return;
      if (!orderId) return;
      const btn = document.getElementById('chatSend');
      btn.disabled = true;
      try {
        let imageUrl = null;
        if (pendingChatImage) {
          imageUrl = await uploadImage(pendingChatImage);
          pendingChatImage = null;
          document.getElementById('chatImage').value = '';
        }
        let content = text;
        if (imageUrl) content = text ? text + '\n' + imageUrl : imageUrl;
        const uid = orderData?.userId || '';
        await addDoc(collection(db, 'devMessages'), {
          orderId,
          conversationId: `dev_${orderId}`,
          fromUserId: 'developer',
          toUserId: uid,
          content,
          timestamp: serverTimestamp(),
          read: false,
          participants: [uid, 'developer'].filter(Boolean)
        });
        input.value = '';
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('chatSend')?.addEventListener('click', sendChat);
    document.getElementById('chatInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
    document.getElementById('chatImage')?.addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (f) { pendingChatImage = f; showToast('Image attached — press send', 'info'); }
    });

    // Same as admin-panel: role check only — no password form
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showDenied('Not signed in.');
        return;
      }
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists() || userDoc.data().role !== 'admin') {
          showDenied('This account is not admin.');
          return;
        }
        adminUser = user;
        showApp();
        loadOrderData();
        listenFiles();
        listenChat();
      } catch (err) {
        console.error(err);
        showDenied('Error verifying access.');
      }
    });
  </script>
</body>
</html>
