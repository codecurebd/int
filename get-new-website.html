        /* ── scroll top ── */

            font-size: 0.9rem;

        .toast.hide {
            animation: slideDown 0.3s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideDown {
            from {

                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(30px);
            }

    </style>

<body>

    <script type="module">
        import {
            auth, db, collection, doc, getDoc, getDocs, onSnapshot,
            addDoc, updateDoc, serverTimestamp,
            signInWithEmailAndPassword, createUserWithEmailAndPassword,
            onAuthStateChanged, signOut, setDoc,
            signInWithPopup, googleProvider,
            query, where, increment
        } from './firebase-config.js';
        import {
renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
            renderCartSidebar, setLoading, renderPaymentModal, syncCart, updateCartInFirestore,
  renderAuthModal
} from './components.js';

        renderNavbar();
    renderAuthModal();
        renderFooter();
        renderCartSidebar();
        renderPaymentModal();
        updateCartBadge();

        // ── toast ──
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400); }, 4500);
        };

        // ── fade-up observer ──
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        });

        // ── scroll top ──
        const scrollBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            scrollBtn.classList.toggle('show', window.scrollY > 400);
        });
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ── auth ──
        // Auth handled by components.js (renderAuthModal / openAuthModal)
// togglePasswordVisibility moved to components.js as toggleAuthPassword
// socialLogin handled by components.js
// Auth form handled by components.js
onAuthStateChanged(auth, async (user) => {
            let name = null;
            if (user) {
                await syncCart(user.uid);
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                name = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
            }
            updateNavbarAuth(user, name);
        });

        // handleLogout handled by components.js
// ─── CURRENCY & PRICE FORMATTING ──────────────────────────────

        let usdRate = 125; // default, will be overridden by settings

        function formatPriceUSD(priceUSD) {
            return '$' + priceUSD.toFixed(2);
        }

        function formatBDT(amountBDT) {
            return '৳' + Math.round(amountBDT).toLocaleString('en-BD');
        }

        function getBDT(priceUSD) {
            return priceUSD * usdRate;
        }

        // ─── UPDATE RATE BANNER ──────────────────────────────────────
        function updateRateBanner() {
            document.getElementById('displayRate').textContent = usdRate;
        }

        // ─── LOAD SETTINGS FROM FIRESTORE ─────────────────────────────

        async function loadPaymentSettings() {
            try {
                const snap = await getDoc(doc(db, 'settings', 'payment'));
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.usdRate && Number(data.usdRate) > 0) {
                        usdRate = Number(data.usdRate);
                        updateRateBanner();
                    }
                }
            } catch (err) {
                console.warn('Could not load payment settings, using default rate 125:', err);
            }
        }

        // ─── PRODUCT LOGIC ──────────────────────────────────────────────

        let allProducts = [];
        let allDiscounts = [];
        let productsReady = false;
        let discountsReady = false;
        let lastRenderKey = '';
        const grid = document.getElementById('productGrid');
        const searchInput = document.getElementById('productSearchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const sortFilter = document.getElementById('sortFilter');

        function renderSkeletons(count = 6) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
              <div class="skeleton-card fade-up">
                <div class="skeleton-img"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line" style="width:40%;"></div>
              </div>
            `;
            }
            grid.innerHTML = html;
            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        }
        renderSkeletons();

        // Debounce snapshot-driven renders so products + discounts + rate
        // don't cause double/triple full grid rebuild (flicker)
        function debounce(fn, wait) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        function getRenderKey() {
            const search = (searchInput?.value || '').toLowerCase();
            const cat = categoryFilter?.value || 'all';
            const sort = sortFilter?.value || 'price-asc';
            return [
                allProducts.length,
                allDiscounts.length,
                usdRate,
                search,
                cat,
                sort,
                allProducts.map(p => p.id + ':' + (p.price || 0)).join(',')
            ].join('|');
        }

        const scheduleProductRender = debounce(() => {
            // Wait until products arrived at least once (keep skeleton)
            if (!productsReady) return;
            const key = getRenderKey();
            // Skip identical re-render (stops flicker when discounts/settings fire right after products)
            if (key === lastRenderKey && grid.children.length > 0 && !grid.querySelector('.skeleton-card')) {
                return;
            }
            lastRenderKey = key;
            renderProducts();
        }, 80);

        // ── get best discount for a product ──
        function getDiscountForProduct(product) {
            if (!allDiscounts || allDiscounts.length === 0) return null;

            const specific = allDiscounts.filter(d => d.type === 'specific' && d.productId === product.id);
            if (specific.length > 0) {
                return specific.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, specific[0]);
            }

            if (product.category) {
                const catDiscounts = allDiscounts.filter(d => d.type === 'category' && d.category === product.category);
                if (catDiscounts.length > 0) {
                    return catDiscounts.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, catDiscounts[0]);
                }
            }

            const all = allDiscounts.filter(d => d.type === 'all');
            if (all.length > 0) {
                return all.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, all[0]);
            }

            return null;
        }

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            let s = '';
            for (let i = 0; i < full; i++) s += '★';
            if (half) s += '☆';
            for (let i = 0; i < 5 - full - half; i++) s += '☆';
            return s;
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function renderProducts() {
            let filtered = [...allProducts];
            const search = searchInput.value.toLowerCase();
            if (search) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(search) ||
                    (p.desc || p.description || '').toLowerCase().includes(search)
                );
            }
            const cat = categoryFilter.value;
            if (cat !== 'all') {
                filtered = filtered.filter(p => p.category?.toLowerCase().trim() === cat);
            }
            const sort = sortFilter.value;
            if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
            else if (sort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

            if (filtered.length === 0) {
                grid.innerHTML =
                    `<div class="col-span-full text-center py-12 text-gray-500"><i class="fas fa-box-open text-5xl opacity-30"></i><p class="mt-3 text-lg">No products found.</p><p class="text-sm">Try adjusting your search or filters.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const rating = p.averageRating || 0;
                const desc = p.desc || p.description || '';
                const discount = getDiscountForProduct(p);
                const originalPrice = p.price;
                let discountedPrice = null;
                let priceHtml = '';
                let badgeHtml = '';
                let percentTagHtml = '';

                if (discount) {
                    discountedPrice = originalPrice * (1 - discount.discountPercent / 100);
                    const percent = Math.round(discount.discountPercent);
                    const origFormatted = formatPriceUSD(originalPrice);
                    const discFormatted = formatPriceUSD(discountedPrice);
                    const origBDT = getBDT(originalPrice);
                    const discBDT = getBDT(discountedPrice);
                    priceHtml = `
                        <span class="original-price">${origFormatted}</span>
                        <span class="discount-price">${discFormatted}</span>
                        <span class="discount-percent-tag"><i class="fas fa-tag"></i> -${percent}%</span>
                        <span class="price-bdt">(BDT <span>${formatBDT(discBDT)}</span>)</span>
                    `;
                    badgeHtml = `<div class="discount-badge"><i class="fas fa-tag"></i> -${percent}%</div>`;
                } else {
                    const priceFormatted = formatPriceUSD(originalPrice);
                    const bdtAmount = getBDT(originalPrice);
                    priceHtml = `
                        <span class="discount-price" style="font-size:1.4rem;">${priceFormatted}</span>
                        <span class="price-bdt">(BDT <span>${formatBDT(bdtAmount)}</span>)</span>
                    `;
                }

                // ── HTML preview vs image ──
                const hasHtml = p.htmlContent && p.htmlContent.length > 0;
                let previewHtml = '';
                if (hasHtml) {
                    const escaped = escapeHtmlAttr(p.htmlContent);
                    previewHtml = `
                        <iframe 
                            srcdoc="${escaped}" 
                            scrolling="no" 
                            loading="lazy" 
                            sandbox="allow-scripts allow-same-origin"
                            style="width:100%; height:100%; border:none; display:block; background:#ffffff;"
                        ></iframe>
                    `;
                } else {
                    const fallbackImg = p.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image';
                    previewHtml = `
                        <img src="${fallbackImg}" alt="${p.name}" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;" />
                    `;
                }

                return `
              <div class="glass-card product-card fade-up">
                <div class="img-wrapper">
                  ${previewHtml}
                  ${badgeHtml}
                </div>
                <div class="card-body">
                  <div class="flex justify-between items-start">
                    <h3 class="font-bold text-xl text-gray-900 product-title">${p.name}</h3>
                  </div>
                  <p class="text-sm text-gray-500 mt-1 product-desc">${desc}</p>
                  <div class="price-wrapper">${priceHtml}</div>
                  <div class="mt-1 text-yellow-500 text-sm">${renderStars(rating)} (${p.ratingCount || 0})</div>
                  <div class="mt-3 flex flex-wrap gap-2">
                    <a href="product-detail.html?id=${p.id}" class="btn-details">
                      <i class="fas fa-eye"></i> Details
                    </a>
                    <button onclick="window.addToCart('${p.id}')" class="btn-add-cart">
                      <i class="fas fa-cart-plus"></i> Add
                    </button>
                  </div>
                </div>
              </div>
            `;
            }).join('');

            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        }

        // ── listen to products & discounts (single coordinated render) ──
        await loadPaymentSettings();

        // Real-time rate updates (skip first paint if rate unchanged)
        let lastUsdRate = usdRate;
        onSnapshot(doc(db, 'settings', 'payment'), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.usdRate && Number(data.usdRate) > 0) {
                    const next = Number(data.usdRate);
                    if (next !== lastUsdRate) {
                        lastUsdRate = next;
                        usdRate = next;
                        updateRateBanner();
                        scheduleProductRender();
                    } else {
                        usdRate = next;
                        updateRateBanner();
                    }
                }
            }
        });

        onSnapshot(collection(db, 'products'), (snapshot) => {
            allProducts = [];
            snapshot.forEach(doc => { allProducts.push({ id: doc.id, ...doc.data() }); });
            productsReady = true;
            scheduleProductRender();
        });

        onSnapshot(collection(db, 'discounts'), (snapshot) => {
            allDiscounts = [];
            snapshot.forEach(doc => { allDiscounts.push({ id: doc.id, ...doc.data() }); });
            discountsReady = true;
            scheduleProductRender();
        });

        const debouncedSearchRender = debounce(() => {
            lastRenderKey = ''; // force render on user filter change
            scheduleProductRender();
        }, 250);
        searchInput.addEventListener('input', debouncedSearchRender);
        categoryFilter.addEventListener('change', () => { lastRenderKey = ''; scheduleProductRender(); });
        sortFilter.addEventListener('change', () => { lastRenderKey = ''; scheduleProductRender(); });

        window.resetFilters = () => {
            searchInput.value = '';
            categoryFilter.value = 'all';
            sortFilter.value = 'price-asc';
            lastRenderKey = '';
            scheduleProductRender();
        };

        // ─── CART ───────────────────────────────────────────────────────

        window.addToCart = async (productId) => {
            const product = allProducts.find(p => p.id === productId);
            if (!product) { showToast('Product not found', 'error'); return; }
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity = (existing.quantity || 1) + 1;
            } else {
                const discount = getDiscountForProduct(product);
                let price = product.price;
                if (discount) price = product.price * (1 - discount.discountPercent / 100);
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: price,
                    originalPrice: product.price,
                    imageUrl: product.imageUrl || '',
                    quantity: 1
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            const user = auth.currentUser;
            if (user) await updateCartInFirestore(user.uid, cart);

            updateCartBadge();
            window.updateCartUI?.();

            showToast(`✅ "${product.name}" added to cart`, 'success');
        };

        console.log('🚀 Store page: currency toggle removed, rate banner added.');
    </script>
</body>
</html>
