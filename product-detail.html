<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Product Detail – CodeCureBD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      transform: translateY(-3px);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(60, 60, 67, 0.08);
      border-radius: 12px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
      outline: none;
      font-family: 'Inter', sans-serif;
      color: #1c1c1e;
    }
    .form-input:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
      background: #ffffff;
    }
    .form-input::placeholder {
      color: #8e8e93;
      opacity: 0.7;
    }
    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 122, 255, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-outline {
      background: transparent;
      color: #1c1c1e;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1.5px solid rgba(60,60,67,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.5);
      min-height: 48px;
    }
    .btn-outline:hover {
      background: rgba(0,122,255,0.04);
      border-color: #007AFF;
      color: #007AFF;
      transform: translateY(-2px);
    }
    .btn-try-now {
      background: linear-gradient(135deg, #FF6B6B, #EE5A24);
      color: #fff;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      box-shadow: 0 4px 16px rgba(238, 90, 36, 0.25);
    }
    .btn-try-now:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(238, 90, 36, 0.35);
    }
    .rating-stars .star {
      font-size: 2rem;
      cursor: pointer;
      transition: 0.2s;
      color: #d1d5db;
    }
    .rating-stars .star.active {
      color: #f59e0b;
    }
    .rating-stars .star:hover {
      transform: scale(1.2);
    }

    /* ===== STATIC PREVIEW (fixed sizing) ===== */
    .static-preview {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      background: #f0f2f5;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .static-preview iframe {
      width: 117.65%;
      height: 117.65%;
      border: none;
      transform: scale(0.85);
      transform-origin: top left;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      background: #fff;
    }
    .static-preview .preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.02);
      pointer-events: none;
      border-radius: 12px;
    }
    .static-preview .preview-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 14px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    @media (max-width: 768px) {
      .static-preview { height: 300px; }
    }
    @media (max-width: 480px) {
      .static-preview { height: 240px; }
    }

    .discount-badge {
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 16px;
      border-radius: 60px;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .price-wrapper {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 0.5rem;
    }
    .original-price {
      text-decoration: line-through;
      color: #9ca3af;
      font-size: 1.1rem;
    }
    .discount-price {
      color: #16a34a;
      font-weight: 700;
      font-size: 2rem;
    }
    .discount-percent-tag {
      background: rgba(220, 38, 38, 0.10);
      color: #dc2626;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid rgba(220, 38, 38, 0.12);
    }
    .price-bdt {
      font-size: 1.1rem;
      color: #6b7280;
      font-weight: 500;
    }
    .price-bdt span {
      font-weight: 600;
      color: #1c1c1e;
    }
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 1rem;
    }

    /* ===== RATE BANNER (inside detail) ===== */
    .rate-banner {
      background: rgba(0, 122, 255, 0.06);
      border: 1px solid rgba(0, 122, 255, 0.12);
      border-radius: 60px;
      padding: 6px 18px;
      font-size: 0.9rem;
      color: #1c1c1e;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .rate-banner i {
      color: #007AFF;
    }
    .rate-banner strong {
      font-weight: 700;
      color: #007AFF;
    }

    /* ===== TRY NOW OVERLAY ===== */
    .trynow-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }
    .trynow-overlay.open {
      display: flex;
    }
    .trynow-overlay .overlay-inner {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      max-width: 1100px;
      width: 100%;
      max-height: 92vh;
      height: 92vh;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      position: relative;
      animation: scaleIn 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .trynow-overlay .close-overlay {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .trynow-overlay .close-overlay:hover {
      background: rgba(0,0,0,0.5);
      transform: scale(1.05);
    }
    .trynow-overlay .demo-content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      background: #fff;
    }
    .trynow-overlay .demo-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .trynow-overlay .bottom-bar {
      flex-shrink: 0;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.3);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.04);
    }
    .trynow-overlay .bottom-bar::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(to top, rgba(255,255,255,0.7) 0%, transparent 100%);
      pointer-events: none;
    }
    .trynow-overlay .bottom-bar button {
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      font-family: 'Inter', sans-serif;
    }
    .trynow-overlay .bottom-bar .btn-buy {
      background: linear-gradient(135deg, #34C759, #28A745);
      color: #fff;
      box-shadow: 0 4px 16px rgba(52, 199, 89, 0.25);
    }
    .trynow-overlay .bottom-bar .btn-buy:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(52, 199, 89, 0.35);
    }
    .trynow-overlay .bottom-bar .btn-cart {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.2);
    }
    .trynow-overlay .bottom-bar .btn-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 122, 255, 0.3);
    }
    .trynow-overlay .bottom-bar .btn-close {
      background: rgba(0,0,0,0.04);
      color: #1c1c1e;
      border: 1px solid rgba(0,0,0,0.06);
      backdrop-filter: blur(4px);
    }
    .trynow-overlay .bottom-bar .btn-close:hover {
      background: rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    @media (max-width: 640px) {
      .trynow-overlay { padding: 0.5rem; }
      .trynow-overlay .overlay-inner { border-radius: 20px; max-height: 96vh; height: 96vh; }
      .trynow-overlay .bottom-bar { padding: 8px 10px; gap: 4px; }
      .trynow-overlay .bottom-bar button { padding: 6px 14px; font-size: 0.75rem; min-height: 32px; gap: 4px; }
      .trynow-overlay .close-overlay { top: 10px; right: 12px; width: 34px; height: 34px; font-size: 1.2rem; }
    }
    @media (max-width: 480px) {
      .trynow-overlay .bottom-bar button { padding: 4px 10px; font-size: 0.65rem; min-height: 28px; gap: 3px; }
    }

    /* ===== SKELETON ===== */
    .skeleton-img {
      width: 100%;
      height: 300px;
      background: #e5e7eb;
      border-radius: 12px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line {
      height: 16px;
      background: #e5e7eb;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.5; }
    }
    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,122,255,0.35);
      z-index: 999;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:hover { transform: scale(1.05); }

    .review-item {
      border-bottom: 1px solid #f3f4f6;
      padding: 12px 0;
    }
    .review-item:last-child {
      border-bottom: none;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 90%;
      max-width: 420px;
      pointer-events: none;
    }
    #toast-container .toast {
      background: rgba(30, 30, 35, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 12px 48px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: slideUp 0.35s ease;
      width: 100%;
      justify-content: center;
    }
    #toast-container .toast.hide {
      animation: slideDown 0.35s ease forwards;
    }
    #toast-container .toast.success { border-left: 4px solid #34C759; }
    #toast-container .toast.error { border-left: 4px solid #FF3B30; }
    #toast-container .toast.warning { border-left: 4px solid #FF9500; }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(20px) scale(0.95); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }
    @keyframes slideDown {
      from { opacity:1; transform: translateY(0) scale(1); }
      to { opacity:0; transform: translateY(20px) scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-4xl mx-auto">
        <!-- Rate banner at top -->
        <div id="detailRateBanner" class="rate-banner mb-4 fade-up">
          <i class="fas fa-exchange-alt"></i>
          1 USD = <strong id="detailDisplayRate">125</strong> BDT
        </div>

        <div id="productDetailContainer">
          <!-- Skeleton -->
          <div class="fade-up">
            <div class="skeleton-img"></div>
            <div class="skeleton-line medium" style="margin-top:1rem;"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line" style="width:50%;"></div>
            <div style="display:flex; gap:1rem; margin-top:1rem;">
              <div class="skeleton-line" style="width:30%;"></div>
              <div class="skeleton-line" style="width:40%;"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- Auth Modal is now rendered by components.js (renderAuthModal) -->

  </div>

  <div id="toast-container"></div>

  <!-- ===== TRY NOW OVERLAY ===== -->
  <div class="trynow-overlay" id="trynowOverlay">
    <div class="overlay-inner">
      <button class="close-overlay" onclick="closeTryNow()" aria-label="Close">&times;</button>
      <div class="demo-content" id="demoContent">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;">
          <i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...
        </div>
      </div>
      <div class="bottom-bar">
        <button class="btn-buy" onclick="window.handleTryNowBuy()"><i class="fas fa-bolt"></i> Buy Now</button>
        <button class="btn-cart" onclick="window.handleTryNowCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn-close" onclick="closeTryNow()"><i class="fas fa-times"></i> Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ================================================================
    // IMPORTS
    // ================================================================
    import {
renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal,
  renderAuthModal
} from './components.js';
    import {
      auth, db, collection, doc, getDoc, getDocs, addDoc, updateDoc,
      query, where, serverTimestamp, onAuthStateChanged, signOut,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, googleProvider, setDoc, onSnapshot
    } from './firebase-config.js';

    // ================================================================
    // RENDER COMMON
    // ================================================================
    renderNavbar();
    renderAuthModal();
    renderFooter();
    renderCartSidebar();
    renderPaymentModal();
    updateCartBadge();

    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
    };

    // ===== SCROLL OBSERVER =====
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    // ===== BACK TO TOP =====
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('show', window.scrollY > 400);
    });
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ================================================================
    // AUTH MODAL
    // ================================================================
    // Auth handled by components.js (renderAuthModal / openAuthModal)
// togglePasswordVisibility moved to components.js as toggleAuthPassword
// socialLogin handled by components.js
// Auth form handled by components.js
// handleLogout handled by components.js
onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
        updateNavbarAuth(user, displayName);
      } else {
        updateNavbarAuth(null, null);
      }
    });

    // ================================================================
    // CURRENCY & PRICE FORMATTING
    // ================================================================
    let usdRate = 125;

    function formatPriceUSD(priceUSD) {
      return '$' + priceUSD.toFixed(2);
    }

    function formatBDT(amountBDT) {
      return '৳' + Math.round(amountBDT).toLocaleString('en-BD');
    }

    function getBDT(priceUSD) {
      return priceUSD * usdRate;
    }

    function updateDetailRateBanner() {
      document.getElementById('detailDisplayRate').textContent = usdRate;
    }

    // ─── LOAD SETTINGS ─────────────────────────────────
    async function loadPaymentSettings() {
      try {
        const snap = await getDoc(doc(db, 'settings', 'payment'));
        if (snap.exists()) {
          const data = snap.data();
          if (data.usdRate && Number(data.usdRate) > 0) {
            usdRate = Number(data.usdRate);
            updateDetailRateBanner();
          }
        }
      } catch (err) {
        console.warn('Could not load payment settings, using default rate 125:', err);
      }
    }

    // ================================================================
    // PRODUCT DETAIL LOGIC
    // ================================================================
    const container = document.getElementById('productDetailContainer');
    let currentProductId = null;
    let currentProductData = null;
    let allDiscounts = [];

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
      container.innerHTML = `
        <div class="glass-card text-center py-12 fade-up">
          <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
          <h2 class="text-2xl font-bold text-gray-900">No product specified</h2>
          <p class="text-gray-500 mt-2">Please go back to the store and select a product.</p>
          <a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a>
        </div>
      `;
    } else {
      currentProductId = productId;
      await loadPaymentSettings();

      // Listen for settings changes
      onSnapshot(doc(db, 'settings', 'payment'), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.usdRate && Number(data.usdRate) > 0) {
            usdRate = Number(data.usdRate);
            updateDetailRateBanner();
            if (currentProductData) {
              renderProductDetail(currentProductData);
            }
          }
        }
      });

      getDocs(collection(db, 'discounts')).then(snap => {
        allDiscounts = [];
        snap.forEach(doc => allDiscounts.push({ id: doc.id, ...doc.data() }));
        loadProduct(productId);
      }).catch(err => {
        console.error('Error loading discounts:', err);
        allDiscounts = [];
        loadProduct(productId);
      });
    }

    function getDiscountForProduct(product) {
      if (!allDiscounts || allDiscounts.length === 0) return null;
      const specific = allDiscounts.filter(d => d.type === 'specific' && d.productId === product.id);
      if (specific.length > 0) {
        return specific.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, specific[0]);
      }
      if (product.category) {
        const catDiscounts = allDiscounts.filter(d => d.type === 'category' && d.category === product.category);
        if (catDiscounts.length > 0) {
          return catDiscounts.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, catDiscounts[0]);
        }
      }
      const all = allDiscounts.filter(d => d.type === 'all');
      if (all.length > 0) {
        return all.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, all[0]);
      }
      return null;
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5 ? 1 : 0;
      let s = '';
      for (let i = 0; i < full; i++) s += '★';
      if (half) s += '☆';
      for (let i = 0; i < 5 - full - half; i++) s += '☆';
      return s;
    }

    async function loadProduct(id) {
      try {
        const docSnap = await getDoc(doc(db, 'products', id));
        if (!docSnap.exists()) {
          container.innerHTML = `
            <div class="glass-card text-center py-12 fade-up">
              <i class="fas fa-box-open text-4xl text-gray-400 mb-4"></i>
              <h2 class="text-2xl font-bold text-gray-900">Product not found</h2>
              <p class="text-gray-500 mt-2">The product you are looking for does not exist.</p>
              <a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a>
            </div>
          `;
          return;
        }
        currentProductData = { id, ...docSnap.data() };
        renderProductDetail(currentProductData);
        loadReviews(id);
        document.title = `${currentProductData.name} – CodeCureBD`;
      } catch (err) {
        console.error('Error loading product:', err);
        container.innerHTML = `
          <div class="glass-card text-center py-12 fade-up">
            <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-900">Error loading product</h2>
            <p class="text-gray-500 mt-2">${err.message}</p>
            <button onclick="window.location.reload()" class="btn-primary mt-4 inline-block">Retry</button>
          </div>
        `;
      }
    }

    // ===== TRY NOW OVERLAY FUNCTIONS =====
    function openTryNow() {
      const overlay = document.getElementById('trynowOverlay');
      const content = document.getElementById('demoContent');
      const htmlContent = currentProductData?.htmlContent;
      if (!htmlContent) {
        showToast('No demo available for this product.', 'warning');
        return;
      }
      const escaped = htmlContent.replace(/"/g, '&quot;');
      content.innerHTML = `<iframe id="demoIframe" style="width:100%; height:100%; border:none;" srcdoc="${escaped}"></iframe>`;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeTryNow() {
      document.getElementById('trynowOverlay').classList.remove('open');
      document.body.style.overflow = '';
      const content = document.getElementById('demoContent');
      content.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;"><i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...</div>`;
    }

    async function handleTryNowBuy() {
      await window.addToCart();
      closeTryNow();
      setTimeout(() => {
        if (typeof window.checkout === 'function') window.checkout();
        else window.location.href = 'get-new-website.html?checkout=1';
      }, 500);
    }

    async function handleTryNowCart() {
      await window.addToCart();
      closeTryNow();
      setTimeout(() => {
        if (typeof window.toggleCart === 'function') window.toggleCart();
      }, 300);
    }

    window.openTryNow = openTryNow;
    window.closeTryNow = closeTryNow;
    window.handleTryNowBuy = handleTryNowBuy;
    window.handleTryNowCart = handleTryNowCart;
    window.addToCart = addToCart;
    window.buyNow = buyNow;
    window.submitRating = submitRating;

    // ================================================================
    // RENDER PRODUCT DETAIL with both USD & BDT
    // ================================================================
    function renderProductDetail(product) {
      const discount = getDiscountForProduct(product);
      const desc = product.desc || product.description || '';
      const rating = product.averageRating || 0;
      const ratingCount = product.ratingCount || 0;

      let priceHtml = '';
      let badgeHtml = '';
      if (discount) {
        const percent = Math.round(discount.discountPercent);
        const discounted = product.price * (1 - discount.discountPercent / 100);
        const origFormatted = formatPriceUSD(product.price);
        const discFormatted = formatPriceUSD(discounted);
        const origBDT = getBDT(product.price);
        const discBDT = getBDT(discounted);
        priceHtml = `
          <span class="original-price">${origFormatted}</span>
          <span class="discount-price">${discFormatted}</span>
          <span class="discount-percent-tag">-${percent}%</span>
          <span class="price-bdt">(BDT <span>${formatBDT(discBDT)}</span>)</span>
        `;
        badgeHtml = `<span class="discount-badge"><i class="fas fa-tag"></i> -${percent}%</span>`;
      } else {
        const priceFormatted = formatPriceUSD(product.price);
        const bdtAmount = getBDT(product.price);
        priceHtml = `
          <span class="discount-price" style="font-size:2rem;">${priceFormatted}</span>
          <span class="price-bdt">(BDT <span>${formatBDT(bdtAmount)}</span>)</span>
        `;
      }

      const hasHtml = product.htmlContent && product.htmlContent.length > 0;

      // ─── STATIC PREVIEW ────────────────────────────────────────
      let previewHtml = '';
      if (hasHtml) {
        const escaped = product.htmlContent.replace(/"/g, '&quot;');
        previewHtml = `
          <div class="static-preview">
            <iframe srcdoc="${escaped}" scrolling="no" style="width:117.65%; height:117.65%; border:none; transform:scale(0.85); transform-origin:top left; pointer-events:none; user-select:none; background:#fff;"></iframe>
            <div class="preview-overlay"></div>
            <div class="preview-badge"><i class="fas fa-image"></i> Preview</div>
          </div>
        `;
      } else {
        previewHtml = `
          <div class="static-preview" style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#f0f2f5;">
            <i class="fas fa-file-code" style="font-size:3rem; opacity:0.3; color:#9ca3af;"></i>
            <span style="color:#9ca3af; font-size:0.95rem;">No HTML preview available</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="fade-up">
          <div class="glass-card" style="padding:0; overflow:hidden;">
            ${previewHtml}
            <div style="padding:1.5rem;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
                <h1 class="text-3xl font-bold text-gray-900">${product.name}</h1>
                ${badgeHtml}
              </div>
              <div class="mt-1 text-yellow-500 text-lg">
                ${renderStars(rating)} <span class="text-gray-500 text-sm">(${ratingCount} reviews)</span>
              </div>
              <div class="price-wrapper">${priceHtml}</div>
              <div class="mt-4 text-gray-700 whitespace-pre-wrap">${desc.replace(/\n/g, '<br>')}</div>
              <div class="action-buttons">
                <button onclick="window.addToCart()" class="btn-primary"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                <button onclick="window.buyNow()" class="btn-primary" style="background:linear-gradient(135deg,#34C759,#28A745);"><i class="fas fa-bolt"></i> Buy Now</button>
                ${hasHtml ? `<button onclick="window.openTryNow()" class="btn-try-now"><i class="fas fa-play-circle"></i> Try Now</button>` : ''}
                <a href="get-new-website.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
              </div>
            </div>
          </div>

          <div class="glass-card mt-8">
            <h3 class="text-xl font-bold text-gray-900 mb-4">Rate & Review</h3>
            <div class="rating-stars flex gap-2" id="ratingStars">
              <span class="star" data-val="1">☆</span>
              <span class="star" data-val="2">☆</span>
              <span class="star" data-val="3">☆</span>
              <span class="star" data-val="4">☆</span>
              <span class="star" data-val="5">☆</span>
            </div>
            <textarea id="ratingReview" rows="3" class="form-input mt-3" placeholder="Write your review..."></textarea>
            <button onclick="window.submitRating()" class="btn-primary mt-3 text-sm py-2 px-4"><i class="fas fa-paper-plane"></i> Submit Review</button>
            <div id="reviewsList" class="mt-6 space-y-2"></div>
          </div>
        </div>
      `;

      // Star rating handler
      document.querySelectorAll('#ratingStars .star').forEach(el => {
        el.addEventListener('click', () => {
          const val = parseInt(el.dataset.val);
          window.selectedRating = val;
          document.querySelectorAll('#ratingStars .star').forEach(s => {
            s.classList.toggle('active', parseInt(s.dataset.val) <= val);
          });
        });
      });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    window.selectedRating = 0;

    async function addToCart() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      const product = currentProductData;
      const discount = getDiscountForProduct(product);
      let price = product.price;
      if (discount) price = product.price * (1 - discount.discountPercent / 100);
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: price,
          originalPrice: product.price,
          imageUrl: '',
          quantity: 1
        });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      const user = auth.currentUser;
      if (user) {
        const { updateCartInFirestore } = await import('./components.js');
        updateCartInFirestore(user.uid, cart);
      }
      updateCartBadge();
      window.updateCartUI?.();
      showToast(`✅ "${product.name}" added to cart`, 'success');
    }

    async function buyNow() {
      await addToCart();
      setTimeout(() => {
        if (typeof window.checkout === 'function') window.checkout();
        else window.location.href = 'get-new-website.html?checkout=1';
      }, 500);
    }

    async function loadReviews(productId) {
      const reviewsContainer = document.getElementById('reviewsList');
      if (!reviewsContainer) return;
      try {
        const q = query(collection(db, 'ratings'), where('productId', '==', productId));
        const snap = await getDocs(q);
        if (snap.empty) {
          reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">No reviews yet. Be the first!</p>';
          return;
        }
        let html = '';
        snap.forEach(doc => {
          const r = doc.data();
          const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          html += `
            <div class="review-item">
              <div class="flex justify-between">
                <span class="font-semibold text-gray-900">${r.userEmail || 'Anonymous'}</span>
                <span class="text-yellow-500">${stars}</span>
              </div>
              ${r.review ? `<p class="text-sm text-gray-600 mt-1">${r.review}</p>` : ''}
              <p class="text-xs text-gray-400 mt-1">${r.timestamp?.toDate?.()?.toLocaleString() || ''}</p>
            </div>
          `;
        });
        reviewsContainer.innerHTML = html;
      } catch (_) {
        reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">Error loading reviews.</p>';
      }
    }

    async function submitRating() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      if (!window.selectedRating || window.selectedRating < 1) {
        showToast('Please select a rating', 'warning');
        return;
      }
      const user = auth.currentUser;
      if (!user) { showToast('Please sign in to rate', 'warning'); return; }
      const review = document.getElementById('ratingReview').value.trim();
      try {
        await addDoc(collection(db, 'ratings'), {
          productId: currentProductData.id,
          userId: user.uid,
          userEmail: user.email,
          rating: window.selectedRating,
          review: review,
          timestamp: serverTimestamp()
        });
        const productRef = doc(db, 'products', currentProductData.id);
        const snap = await getDoc(productRef);
        const data = snap.data();
        const count = (data.ratingCount || 0) + 1;
        const avg = ((data.averageRating || 0) * (data.ratingCount || 0) + window.selectedRating) / count;
        await updateDoc(productRef, { averageRating: avg, ratingCount: count });
        showToast('✅ Review submitted!', 'success');
        window.selectedRating = 0;
        document.querySelectorAll('#ratingStars .star').forEach(s => s.classList.remove('active'));
        document.getElementById('ratingReview').value = '';
        loadReviews(currentProductData.id);
        renderProductDetail(currentProductData);
      } catch (err) {
        showToast('⚠️ ' + err.message, 'error');
      }
    }

    console.log('📄 Product detail: currency toggle removed, rate banner added.');
  </script>
</body>
</html>
