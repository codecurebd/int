<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Contact Support | CodeCureBD</title>
  
  <!-- ✅ Preconnect & Preload for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ===== FONT DISPLAY SWAP ===== */
    @font-face {
      font-family: 'Inter';
      font-display: swap;
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    }

    /* ===== MESSENGER ===== */
    .messenger-wrap {
      display: flex;
      flex-direction: column;
      height: 70vh;
      min-height: 460px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    }

    /* ===== CHAT HEADER ===== */
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .chat-header .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .chat-header .chat-info {
      flex: 1;
    }
    .chat-header .chat-info .name {
      font-weight: 600;
      color: #1c1c1e;
      font-size: 1.05rem;
    }
    .chat-header .chat-info .status {
      font-size: 0.75rem;
      color: #34C759;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-header .chat-info .status .dot {
      width: 8px;
      height: 8px;
      background: #34C759;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== CHAT MESSAGES ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(248, 249, 252, 0.6);
    }

    /* ===== MESSAGE BUBBLE ===== */
    .chat-msg {
      max-width: 78%;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      word-wrap: break-word;
      animation: fadeUp 0.25s ease;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .chat-msg.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      color: #1c1c1e;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .chat-msg .msg-time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 6px;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .chat-msg.sent .msg-time {
      color: rgba(255,255,255,0.7);
    }
    .chat-msg .msg-status {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-left: 4px;
    }
    /* Image inside message */
    .chat-msg img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 12px;
      margin-top: 6px;
      display: block;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .chat-msg.sent img {
      border-color: rgba(255,255,255,0.3);
    }

    /* ===== CHAT INPUT ===== */
    .chat-input-wrap {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid rgba(0,0,0,0.04);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      align-items: center;
    }
    .chat-input-wrap .input-wrapper {
      flex: 1;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,0.8);
      border-radius: 30px;
      border: 1.5px solid rgba(60,60,67,0.08);
      padding: 0 6px 0 18px;
      transition: 0.2s;
    }
    .chat-input-wrap .input-wrapper:focus-within {
      border-color: #007AFF;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0,122,255,0.06);
    }
    .chat-input-wrap .input-wrapper input {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      outline: none;
      min-width: 0;
    }
    .chat-input-wrap .input-wrapper input::placeholder {
      color: #8e8e93;
      opacity: 0.7;
    }
    /* File attachment button */
    .chat-input-wrap .file-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 8px 10px;
      transition: 0.2s;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-input-wrap .file-btn:hover {
      color: #007AFF;
      background: rgba(0,122,255,0.06);
    }
    .chat-input-wrap .file-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .chat-input-wrap .file-btn input[type="file"] {
      display: none;
    }
    /* Image preview before sending */
    .chat-input-wrap .image-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.04);
      border-radius: 30px;
      padding: 4px 12px 4px 4px;
      margin-right: 4px;
      flex-shrink: 0;
      animation: fadeUp 0.2s ease;
    }
    .chat-input-wrap .image-preview.show {
      display: flex;
    }
    .chat-input-wrap .image-preview img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .chat-input-wrap .image-preview .remove-preview {
      background: none;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0 4px;
    }
    .chat-input-wrap .image-preview .remove-preview:hover {
      color: #FF3B30;
    }

    .chat-input-wrap .send-btn {
      border-radius: 50%;
      width: 50px;
      height: 50px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1.2rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0,122,255,0.2);
    }
    .chat-input-wrap .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,122,255,0.3);
    }
    .chat-input-wrap .send-btn:disabled {
      opacity: 0.5;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ===== EMPTY / ERROR STATE ===== */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8e8e93;
      font-size: 0.95rem;
      flex-direction: column;
      gap: 10px;
    }
    .empty-state i {
      font-size: 2.8rem;
      opacity: 0.3;
    }
    .empty-state .retry-btn {
      margin-top: 8px;
      background: #007AFF;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    .empty-state .retry-btn:hover {
      background: #0055b3;
    }

    /* ===== SKELETON ===== */
    .skeleton-msg {
      height: 54px;
      background: #e5e7eb;
      border-radius: 12px;
      margin-bottom: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-msg.sent {
      align-self: flex-end;
      width: 60%;
      border-bottom-right-radius: 4px;
    }
    .skeleton-msg.received {
      align-self: flex-start;
      width: 70%;
      border-bottom-left-radius: 4px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SCROLLBAR ===== */
    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #d0d0d5;
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .messenger-wrap {
        height: 75vh;
        min-height: 400px;
        border-radius: 16px;
      }
      .chat-header {
        padding: 12px 16px;
      }
      .chat-messages {
        padding: 14px 16px;
      }
      .chat-msg {
        max-width: 92%;
        font-size: 0.9rem;
        padding: 10px 14px;
      }
      .chat-input-wrap {
        padding: 12px 16px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chat-input-wrap .input-wrapper {
        padding-left: 14px;
      }
      .chat-input-wrap .input-wrapper input {
        padding: 10px 0;
        font-size: 0.9rem;
      }
      .chat-input-wrap .send-btn {
        width: 46px;
        height: 46px;
        font-size: 1rem;
      }
      .chat-input-wrap .file-btn {
        font-size: 1.1rem;
        padding: 6px 8px;
      }
    }
    @media (max-width: 480px) {
      .chat-header .chat-avatar {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
      .chat-header .chat-info .name {
        font-size: 0.95rem;
      }
      .chat-input-wrap .image-preview img {
        width: 28px;
        height: 28px;
      }
    }

    /* ===== FADE-UP ===== */
    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== BACK TO TOP ===== */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,122,255,0.35);
      z-index: 999;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 fade-up">Support Chat</h1>
        <p class="text-gray-500 mb-6 fade-up">Chat directly with our support team. You can also attach images.</p>

        <div class="messenger-wrap fade-up">
          <!-- Chat Header -->
          <div class="chat-header">
            <div class="chat-avatar"><i class="fas fa-headset"></i></div>
            <div class="chat-info">
              <div class="name">Admin Support</div>
              <div class="status"><span class="dot"></span> Online</div>
            </div>
          </div>

          <!-- Chat Messages -->
          <div class="chat-messages" id="chatMessages">
            <!-- Skeleton will be replaced by JS -->
            <div class="skeleton-msg received"></div>
            <div class="skeleton-msg sent"></div>
            <div class="skeleton-msg received" style="width:50%;"></div>
          </div>

          <!-- Chat Input -->
          <form class="chat-input-wrap" id="chatForm">
            <div class="input-wrapper">
              <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" />
              <!-- File attachment button -->
              <label class="file-btn" id="fileBtn" title="Attach image">
                <i class="fas fa-image"></i>
                <input type="file" id="fileInput" accept="image/*" />
              </label>
              <!-- Image preview (hidden initially) -->
              <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="#" alt="preview" />
                <button type="button" class="remove-preview" id="removePreview" title="Remove image">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="send-btn" id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
          </form>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Auth Modal is now rendered by components.js (renderAuthModal) -->

  </div>

  <div id="toast-container"></div>

  <script type="module">
    // ================================================================
    // ইমপোর্ট
    // ================================================================
    import { 
      auth, db, collection, doc, getDoc, setDoc, addDoc, onSnapshot, 
      query, where, serverTimestamp, signOut, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, updateDoc,
      signInWithPopup, googleProvider
    } from './firebase-config.js';
    import {
renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal, uploadImage,
  renderAuthModal
} from './components.js';

    // ===== রেন্ডার =====
    renderNavbar();
    renderAuthModal();
    renderFooter();
    renderCartSidebar();
    renderPaymentModal();
    updateCartBadge();

    // ===== টোস্ট =====
    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
    };

    // ===== SCROLL ANIMATION =====
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    // ===== BACK TO TOP =====
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('show', window.scrollY > 400);
    });
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ================================================================
    // AUTH MODAL LOGIC
    // ================================================================
    // Auth handled by components.js (renderAuthModal / openAuthModal)
// togglePasswordVisibility moved to components.js as toggleAuthPassword
// socialLogin handled by components.js
// Auth form handled by components.js
onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
      updateNavbarAuth(user, displayName);
      // Start chat after auth
      initChat(user);
    });

    // handleLogout handled by components.js
// ================================================================
    // ✅ CHAT LOGIC with Image Attachment
    // ================================================================
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileBtn = document.getElementById('fileBtn');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removePreviewBtn = document.getElementById('removePreview');

    let currentUser = null;
    let conversationId = null;
    let unsubMessages = null;
    let pendingImageFile = null; // for upload before sending

    // ----- Image preview handlers -----
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file.', 'warning');
        fileInput.value = '';
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showToast('Image must be less than 10MB.', 'warning');
        fileInput.value = '';
        return;
      }
      pendingImageFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        previewImg.src = ev.target.result;
        imagePreview.classList.add('show');
        fileBtn.querySelector('i').className = 'fas fa-check-circle text-green-500';
      };
      reader.readAsDataURL(file);
    });

    removePreviewBtn.addEventListener('click', () => {
      clearImagePreview();
    });

    function clearImagePreview() {
      pendingImageFile = null;
      imagePreview.classList.remove('show');
      previewImg.src = '#';
      fileInput.value = '';
      fileBtn.querySelector('i').className = 'fas fa-image';
    }

    // ----- Render messages (with image support) -----
    function renderMessages(msgs) {
      if (!msgs || msgs.length === 0) {
        chatMessages.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-comment-dots"></i>
            <span>No messages yet. Start the conversation!</span>
          </div>
        `;
        return;
      }
      let html = '';
      msgs.forEach(m => {
        const isSent = m.fromUserId === currentUser?.uid;
        const time = m.timestamp?.toDate?.()?.toLocaleString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit',
          month: 'short',
          day: 'numeric'
        }) || '';
        let statusHtml = '';
        if (isSent) {
          const readStatus = m.read ? '✓✓' : '✓';
          statusHtml = `<span class="msg-status">${readStatus}</span>`;
        }
        // Check if content is an image URL
        const content = m.content || '';
        const isImage = content.match(/^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)/i) || 
                        content.includes('res.cloudinary.com');
        let contentHtml = '';
        if (isImage) {
          contentHtml = `<img src="${content}" alt="attached image" loading="lazy" />`;
        } else {
          contentHtml = content;
        }
        html += `
          <div class="chat-msg ${isSent ? 'sent' : 'received'}">
            ${contentHtml}
            <div class="msg-time">
              ${time} ${statusHtml}
            </div>
          </div>
        `;
      });
      chatMessages.innerHTML = html;
      // Auto-scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Show skeleton while loading
    function showSkeletons() {
      chatMessages.innerHTML = `
        <div class="skeleton-msg received"></div>
        <div class="skeleton-msg sent"></div>
        <div class="skeleton-msg received" style="width:50%;"></div>
      `;
    }

    // Show error state
    function showErrorState(errorMessage) {
      const existingMsgs = chatMessages.querySelectorAll('.chat-msg');
      if (existingMsgs.length > 0) {
        const banner = document.createElement('div');
        banner.className = 'empty-state';
        banner.style.cssText = 'padding: 8px 12px; background: #fee2e2; border-radius: 8px; margin-bottom: 8px; color: #991b1b; font-size: 0.85rem; flex-direction: row; gap: 8px;';
        banner.innerHTML = `
          <i class="fas fa-exclamation-triangle" style="font-size:1.2rem; opacity:0.6;"></i>
          <span>${errorMessage || 'Error loading messages. Please retry.'}</span>
          <button class="retry-btn" style="padding:4px 12px; font-size:0.75rem; background:#dc2626; color:white; border:none; border-radius:30px; cursor:pointer;">Retry</button>
        `;
        banner.querySelector('.retry-btn').addEventListener('click', () => {
          banner.remove();
          initChat(currentUser);
        });
        chatMessages.prepend(banner);
      } else {
        chatMessages.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle text-red-500"></i>
            <span>${errorMessage || 'Error loading messages. Please retry.'}</span>
            <button class="retry-btn" onclick="window.location.reload()">Retry</button>
          </div>
        `;
      }
    }

    async function initChat(user) {
      if (!user) return;
      currentUser = user;
      conversationId = `conv_${user.uid}_admin`;

      // Unsubscribe previous listener if any
      if (unsubMessages) {
        unsubMessages();
        unsubMessages = null;
      }

      showSkeletons();

      const q = query(
        collection(db, 'messages'),
        where('conversationId', '==', conversationId),
        where('participants', 'array-contains', user.uid)
      );

      unsubMessages = onSnapshot(q, (snapshot) => {
        const msgs = [];
        snapshot.forEach(doc => {
          msgs.push({ id: doc.id, ...doc.data() });
        });
        msgs.sort((a, b) => {
          const ta = a.timestamp?.toDate?.()?.getTime() || 0;
          const tb = b.timestamp?.toDate?.()?.getTime() || 0;
          return ta - tb;
        });
        renderMessages(msgs);

        // Mark admin messages as read
        const unreadAdminMsgs = msgs.filter(m => m.fromUserId === 'admin' && !m.read);
        if (unreadAdminMsgs.length > 0) {
          unreadAdminMsgs.forEach(async (m) => {
            try {
              await updateDoc(doc(db, 'messages', m.id), { 
                read: true, 
                readAt: serverTimestamp() 
              });
            } catch (err) {
              console.warn('Failed to mark message as read:', err);
            }
          });
        }
      }, (error) => {
        console.error('🔥 Snapshot error in messages:', error);
        const errorMsg = error.message || 'Unknown error loading messages.';
        showErrorState(errorMsg);
        showToast('⚠️ ' + errorMsg, 'error');
      });
    }

    // ===== SEND MESSAGE (with image upload) =====
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      const hasFile = !!pendingImageFile;

      if (!text && !hasFile) {
        showToast('Please type a message or attach an image.', 'warning');
        return;
      }
      if (!currentUser) {
        showToast('Please sign in first.', 'warning');
        return;
      }
      if (!conversationId) {
        showToast('Conversation not ready. Please refresh.', 'error');
        return;
      }

      setLoading(chatSendBtn, true);
      let imageUrl = null;

      try {
        // 1. Upload image if present
        if (hasFile) {
          imageUrl = await uploadImage(pendingImageFile);
          // clear preview after successful upload
          clearImagePreview();
        }

        // 2. Build final content
        let finalContent = text;
        if (imageUrl) {
          if (text) {
            finalContent = text + '\n' + imageUrl;
          } else {
            finalContent = imageUrl;
          }
        }

        // 3. Send message
        await addDoc(collection(db, 'messages'), {
          conversationId: conversationId,
          fromUserId: currentUser.uid,
          toUserId: 'admin',
          content: finalContent,
          timestamp: serverTimestamp(),
          read: false,
          participants: [currentUser.uid, 'admin']
        });

        chatInput.value = '';
        chatInput.focus();
        // If image was sent without text, preview is already cleared
      } catch (err) {
        console.error('Send error:', err);
        showToast('Error sending message: ' + err.message, 'error');
        // If upload failed but we cleared preview, restore it? We'll just keep preview cleared.
      } finally {
        setLoading(chatSendBtn, false);
        // Ensure preview is cleared if any error
        if (pendingImageFile) clearImagePreview();
      }
    });

    // ===== Auto-clear preview on Enter (if image only) =====
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && pendingImageFile) {
        // Let form submit handle it
      }
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (unsubMessages) unsubMessages();
    });

    console.log('💬 Messages page loaded with image attachment support.');
  </script>
</body>
</html>
