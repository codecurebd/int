<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Support Chat | CodeCureBD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="style.css" />

    <style>
        /* ─────────────────────────────────────────────────────────────
           PROFESSIONAL SUPPORT CHAT — MODERN SAAS STYLE
           ───────────────────────────────────────────────────────────── */
        * { box-sizing: border-box; }
        body {
            background: #f0f4f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            padding-top: 72px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 !important;
        }
        .chat-full-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 1100px;
            margin: 16px auto;
            padding: 12px 16px 16px !important;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .messenger-wrap {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        /* ─── Conversation List ─── */
        .conv-list {
            width: 340px;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            background: #fafbfc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .conv-list-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .conv-list-header .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .conv-list-header .title i {
            color: #0066FF;
            font-size: 1rem;
        }
        .conv-list-header .new-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
        }
        .conv-list-header .new-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.35);
        }

        .conv-filter {
            display: flex;
            padding: 6px 20px 10px;
            gap: 6px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }
        .conv-filter button {
            padding: 5px 14px;
            border: none;
            background: none;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.2s;
        }
        .conv-filter button:hover { color: #0f172a; }
        .conv-filter button.active {
            background: rgba(0, 102, 255, 0.08);
            color: #0066FF;
        }

        .conv-items {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .conv-items .empty {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .conv-items .empty i {
            font-size: 2rem;
            opacity: 0.3;
            display: block;
            margin-bottom: 8px;
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            cursor: pointer;
            transition: 0.15s;
            border-left: 3px solid transparent;
        }
        .conv-item:hover { background: rgba(0, 102, 255, 0.04); }
        .conv-item.active {
            background: rgba(0, 102, 255, 0.06);
            border-left-color: #0066FF;
        }
        .conv-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .conv-item .info {
            flex: 1;
            min-width: 0;
        }
        .conv-item .info .name {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .conv-item .info .name .time {
            font-weight: 400;
            font-size: 0.65rem;
            color: #94a3b8;
        }
        .conv-item .info .last {
            font-size: 0.78rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .badge {
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            border-radius: 40px;
            padding: 0 8px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 18px;
            min-width: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .conv-item .archive-icon {
            color: #94a3b8;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
        }
        .conv-item:hover .archive-icon { opacity: 1; }
        .conv-item .archive-icon:hover { color: #ef4444; }
        .conv-item .restore-icon {
            color: #22c55e;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
        }
        .conv-item:hover .restore-icon { opacity: 1; }
        .conv-item .restore-icon:hover { color: #16a34a; }

        /* ─── Chat Area ─── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #ffffff;
        }

        .chat-area .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            background: #fafbfc;
        }
        .chat-area .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .chat-area .chat-header .info {
            flex: 1;
            min-width: 0;
        }
        .chat-area .chat-header .info .name {
            font-weight: 700;
            color: #0f172a;
            font-size: 1rem;
        }
        .chat-area .chat-header .info .status {
            font-size: 0.72rem;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-area .chat-header .info .status .dot {
            width: 7px;
            height: 7px;
            background: #34C759;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }
        .chat-header-actions {
            display: flex;
            gap: 4px;
        }
        .chat-header-actions button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .chat-header-actions button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #0f172a;
        }
        .chat-header-actions .archive-btn { color: #94a3b8; }
        .chat-header-actions .archive-btn:hover {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
        }
        .chat-header-actions .unarchive-btn { color: #94a3b8; }
        .chat-header-actions .unarchive-btn:hover {
            background: rgba(34, 197, 94, 0.08);
            color: #22c55e;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f8fafc;
            scroll-behavior: smooth;
            position: relative;
        }

        .date-sep {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0 12px;
            gap: 12px;
        }
        .date-sep::before, .date-sep::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
            max-width: 60px;
        }
        .date-sep span {
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: min(80%, 480px);
            margin-bottom: 2px;
        }
        .msg-row.sent { align-self: flex-end; margin-left: auto; }
        .msg-row.received { align-self: flex-start; margin-right: auto; }

        .msg-bubble {
            display: block;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-break: normal;
        }
        .msg-row.sent .msg-bubble {
            background: linear-gradient(135deg, #0066FF 0%, #5856D6 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 10px rgba(0, 102, 255, 0.14);
        }
        .msg-row.received .msg-bubble {
            background: #ffffff;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.03);
        }
        .msg-bubble .text {
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: break-word;
        }
        .msg-bubble .img-wrap {
            margin: 0 0 4px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            max-width: 240px;
            position: relative;
        }
        .msg-bubble .img-wrap:hover img { transform: scale(1.02); }
        .msg-bubble .img-wrap img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 3px;
            font-size: 0.62rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .msg-row.sent .msg-meta { justify-content: flex-end; }
        .msg-meta .status {
            font-size: 0.7rem;
            letter-spacing: -1px;
        }
        .msg-meta .status.read { color: #0066FF; }
        .msg-meta .status.unread { color: #94a3b8; opacity: 0.8; }

        .scroll-bottom {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            color: #0066FF;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .scroll-bottom.show { display: flex; animation: fadeUp 0.25s ease; }
        .scroll-bottom:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(0, 102, 255, 0.2);
        }
        .scroll-bottom .count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #FF3B30;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .scroll-bottom .count.show { display: flex; }

        .quick-replies {
            display: flex;
            gap: 8px;
            padding: 0 20px 10px;
            overflow-x: auto;
            flex-shrink: 0;
            background: rgba(248, 250, 252, 0.9);
            scrollbar-width: none;
        }
        .quick-replies::-webkit-scrollbar { display: none; }
        .quick-replies button {
            flex-shrink: 0;
            background: #fff;
            border: 1.5px solid rgba(0, 102, 255, 0.1);
            color: #0066FF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .quick-replies button:hover {
            background: rgba(0, 102, 255, 0.06);
            border-color: #0066FF;
            transform: translateY(-1px);
        }

        .chat-input-wrap {
            padding: 10px 20px 14px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .chat-input-wrap .input-wrapper {
            flex: 1;
            display: flex;
            gap: 6px;
            align-items: flex-end;
            background: #f1f5f9;
            border-radius: 24px;
            border: 1.5px solid transparent;
            padding: 4px 6px 4px 18px;
            transition: 0.2s;
            min-height: 48px;
        }
        .chat-input-wrap .input-wrapper:focus-within {
            border-color: #0066FF;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.06);
        }
        .chat-input-wrap .input-wrapper textarea {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            font-size: 0.92rem;
            outline: none;
            min-width: 0;
            resize: none;
            max-height: 120px;
            line-height: 1.45;
            font-family: inherit;
            color: #1e293b;
        }
        .chat-input-wrap .input-wrapper textarea::placeholder { color: #94a3b8; opacity: 1; }

        .chat-input-wrap .file-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-input-wrap .file-btn:hover {
            color: #0066FF;
            background: rgba(0, 102, 255, 0.06);
        }
        .chat-input-wrap .file-btn input[type="file"] { display: none; }

        .chat-input-wrap .image-preview {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 102, 255, 0.06);
            border-radius: 16px;
            padding: 4px 10px 4px 4px;
            margin-right: 2px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 102, 255, 0.1);
        }
        .chat-input-wrap .image-preview.show { display: flex; }
        .chat-input-wrap .image-preview img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .chat-input-wrap .image-preview .remove {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
            border-radius: 50%;
            transition: 0.15s;
        }
        .chat-input-wrap .image-preview .remove:hover {
            color: #FF3B30;
            background: rgba(255, 59, 48, 0.08);
        }

        .chat-input-wrap .send-btn {
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.2);
        }
        .chat-input-wrap .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 22px rgba(0, 102, 255, 0.3);
        }
        .chat-input-wrap .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 0.95rem;
            flex-direction: column;
            gap: 8px;
            padding: 2rem;
            text-align: center;
        }
        .empty-state i { font-size: 2.8rem; opacity: 0.25; }
        .empty-state .title { font-weight: 700; color: #334155; font-size: 1.05rem; }
        .empty-state .desc { font-size: 0.85rem; color: #94a3b8; max-width: 260px; line-height: 1.5; }

        .img-lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            cursor: zoom-out;
        }
        .img-lightbox.open { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .img-lightbox img {
            max-width: 95vw;
            max-height: 88vh;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            object-fit: contain;
        }
        .img-lightbox .close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .img-lightbox .close:hover { background: rgba(255, 255, 255, 0.25); }

        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #0066FF;
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }
        .toast.success { border-left-color: #22c55e; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.hide { opacity: 0; transform: translateX(30px); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .conv-list { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.06); }
            .messenger-wrap { flex-direction: column; }
            .chat-full-section { border-radius: 14px; }
            .page-wrapper { padding-top: 66px; }
            .chat-messages { padding: 16px 16px 12px; }
            .chat-input-wrap { padding: 8px 14px 12px; gap: 6px; }
            .chat-input-wrap .input-wrapper { padding: 2px 4px 2px 14px; min-height: 42px; }
            .chat-input-wrap .send-btn { width: 42px; height: 42px; font-size: 1rem; }
            .msg-row { max-width: min(90%, 380px); }
            .msg-bubble { font-size: 0.88rem; padding: 8px 14px; }
            .conv-item { padding: 10px 14px; }
            .conv-item .avatar { width: 38px; height: 38px; font-size: 0.85rem; }
        }
        @media (max-width: 480px) {
            .page-wrapper { padding-top: 60px; }
            .conv-list-header { padding: 14px 16px 10px; }
            .conv-item { padding: 8px 12px; gap: 10px; }
            .conv-item .avatar { width: 34px; height: 34px; font-size: 0.75rem; }
            .conv-item .info .name { font-size: 0.82rem; }
            .conv-item .info .last { font-size: 0.72rem; }
            .chat-area .chat-header { padding: 10px 16px; }
            .chat-area .chat-header .avatar { width: 34px; height: 34px; font-size: 0.8rem; }
            .chat-messages { padding: 12px 12px 10px; }
            .msg-row { max-width: min(92%, 300px); }
            .msg-bubble { font-size: 0.84rem; padding: 7px 12px; }
            .quick-replies { padding: 0 12px 8px; gap: 6px; }
            .quick-replies button { font-size: 0.7rem; padding: 4px 10px; }
            .chat-input-wrap { padding: 6px 12px 10px; gap: 4px; }
            .chat-input-wrap .input-wrapper { min-height: 36px; padding: 2px 4px 2px 12px; }
            .chat-input-wrap .input-wrapper textarea { font-size: 0.85rem; padding: 8px 0; }
            .chat-input-wrap .send-btn { width: 36px; height: 36px; font-size: 0.85rem; }
            .chat-input-wrap .file-btn { font-size: 1rem; padding: 4px; }
            .conv-filter { padding: 4px 14px 8px; gap: 4px; }
            .conv-filter button { font-size: 0.7rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div id="navbar-placeholder"></div>

        <main class="main-content">
            <section class="chat-full-section">
                <div class="messenger-wrap">
                    <!-- Conversation List -->
                    <div class="conv-list" id="convList">
                        <div class="conv-list-header">
                            <span class="title"><i class="fas fa-comment-dots"></i> Conversations</span>
                            <button class="new-btn" id="newChatBtn" title="New conversation">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <div class="conv-filter">
                            <button class="active" data-filter="active">Active</button>
                            <button data-filter="archived">Archived</button>
                        </div>
                        <div class="conv-items" id="convItems">
                            <div class="empty"><i class="fas fa-inbox"></i>Loading conversations…</div>
                        </div>
                    </div>

                    <!-- Chat Area -->
                    <div class="chat-area" id="chatArea">
                        <div class="chat-header" id="chatHeader">
                            <div class="avatar" id="chatAvatar"><i class="fas fa-headset"></i></div>
                            <div class="info">
                                <div class="name" id="chatName">Admin Support</div>
                                <div class="status"><span class="dot"></span> Online</div>
                            </div>
                            <div class="chat-header-actions">
                                <button class="archive-btn" id="archiveBtn" title="Archive conversation">
                                    <i class="fas fa-archive"></i>
                                </button>
                                <button class="unarchive-btn" id="unarchiveBtn" title="Restore from archive" style="display:none;">
                                    <i class="fas fa-undo"></i>
                                </button>
                            </div>
                        </div>

                        <div class="chat-messages" id="chatMessages">
                            <div class="empty-state">
                                <i class="fas fa-comment-dots"></i>
                                <div class="title">Select a conversation</div>
                                <div class="desc">Choose a conversation from the list or start a new one.</div>
                            </div>
                        </div>

                        <button class="scroll-bottom" id="scrollBtn">
                            <i class="fas fa-chevron-down"></i>
                            <span class="count" id="newCount">0</span>
                        </button>

                        <div class="quick-replies" id="quickReplies">
                            <button data-text="Hi, I need help with my order.">📦 Order help</button>
                            <button data-text="I have a payment / transaction question.">💳 Payment</button>
                            <button data-text="I need a website fix / repair.">🔧 Website fix</button>
                            <button data-text="Thanks for your help!">🙏 Thank you</button>
                        </div>

                        <form class="chat-input-wrap" id="chatForm">
                            <div class="input-wrapper">
                                <textarea id="chatInput" rows="1" placeholder="Type a message…" autocomplete="off"></textarea>
                                <div class="image-preview" id="imagePreview">
                                    <img id="previewImg" src="#" alt="preview" />
                                    <button type="button" class="remove" id="removePreview" title="Remove image">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <label class="file-btn" id="fileBtn" title="Attach image">
                                    <i class="fas fa-image"></i>
                                    <input type="file" id="fileInput" accept="image/*" />
                                </label>
                            </div>
                            <button type="submit" class="send-btn" id="sendBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <!-- Image Lightbox -->
    <div class="img-lightbox" id="imgLightbox">
        <button class="close" id="lbClose" aria-label="Close">&times;</button>
        <img id="lbImage" src="" alt="Full size" />
    </div>

    <div id="toast-container"></div>

    <script type="module">
        // ─────────────────────────────────────────────────────────────
        // IMPORTS
        // ─────────────────────────────────────────────────────────────
        import {
            auth, db, collection, doc, getDoc, setDoc, addDoc, onSnapshot,
            query, where, serverTimestamp, onAuthStateChanged, updateDoc,
            deleteDoc, getDocs, orderBy
        } from './firebase-config.js';
        import {
            renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
            renderCartSidebar, setLoading, renderPaymentModal, uploadImage,
            renderAuthModal
        } from './components.js';

        renderNavbar();
        renderAuthModal();
        renderFooter();
        renderCartSidebar();
        renderPaymentModal();
        updateCartBadge();

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400); }, 4500);
        };

        // ─────────────────────────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────────────────────────
        let currentUser = null;
        let conversations = [];
        let currentConvId = null;
        let unsubMessages = null;
        let unsubConversations = null;
        let pendingImage = null;
        let userNearBottom = true;
        let pendingNewCount = 0;
        let lastMsgCount = 0;
        let currentFilter = 'active';

        // DOM refs
        const convItems = document.getElementById('convItems');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const fileBtn = document.getElementById('fileBtn');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removePreview = document.getElementById('removePreview');
        const scrollBtn = document.getElementById('scrollBtn');
        const newCount = document.getElementById('newCount');
        const imgLightbox = document.getElementById('imgLightbox');
        const lbImage = document.getElementById('lbImage');
        const lbClose = document.getElementById('lbClose');
        const chatName = document.getElementById('chatName');
        const chatAvatar = document.getElementById('chatAvatar');
        const archiveBtn = document.getElementById('archiveBtn');
        const unarchiveBtn = document.getElementById('unarchiveBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const filterBtns = document.querySelectorAll('.conv-filter button');

        // ─────────────────────────────────────────────────────────────
        // HELPERS
        // ─────────────────────────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function isImageUrl(str) {
            if (!str) return false;
            const t = String(str).trim();
            return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?.*)?$/i.test(t) ||
                t.includes('res.cloudinary.com');
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
            if (diff < 86400000) return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            if (diff < 604800000) return date.toLocaleDateString('en-US', { weekday: 'short' });
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getDateLabel(date) {
            if (!date || isNaN(date.getTime())) return '';
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diff = Math.round((today - msgDay) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Yesterday';
            if (diff < 7) return date.toLocaleDateString('en-US', { weekday: 'long' });
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        }

        function parseContent(content) {
            const raw = content || '';
            const lines = raw.split('\n');
            let textParts = [];
            let imageUrl = null;
            lines.forEach(line => {
                const t = line.trim();
                if (isImageUrl(t)) imageUrl = t;
                else if (t) textParts.push(line);
            });
            if (!imageUrl && isImageUrl(raw.trim())) {
                imageUrl = raw.trim();
                textParts = [];
            }
            return { text: textParts.join('\n'), imageUrl };
        }

        // ─────────────────────────────────────────────────────────────
        // RENDER CONVERSATION LIST
        // ─────────────────────────────────────────────────────────────
        function renderConvList() {
            const filtered = conversations.filter(c => c.status === currentFilter);
            if (filtered.length === 0) {
                convItems.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-${currentFilter === 'active' ? 'inbox' : 'archive'}"></i>
                        No ${currentFilter} conversations
                    </div>`;
                return;
            }
            filtered.sort((a, b) => {
                const ta = a.lastMessageTime?.toDate?.()?.getTime() || a.lastMessageTime || 0;
                const tb = b.lastMessageTime?.toDate?.()?.getTime() || b.lastMessageTime || 0;
                return tb - ta;
            });

            let html = '';
            filtered.forEach(conv => {
                const isActive = conv.id === currentConvId;
                const name = 'Admin Support';
                const avatar = 'A';
                const last = conv.lastMessage || 'No messages yet';
                const time = formatTime(conv.lastMessageTime);
                const unread = conv.unreadCount || 0;
                const isArchived = conv.status === 'archived';
                html += `
                    <div class="conv-item ${isActive ? 'active' : ''}" data-id="${conv.id}">
                        <div class="avatar">${avatar}</div>
                        <div class="info">
                            <div class="name">
                                <span>${name}</span>
                                <span class="time">${time}</span>
                            </div>
                            <div class="last">${escapeHtml(last)}</div>
                        </div>
                        ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
                        ${isArchived ? `<span class="restore-icon" data-id="${conv.id}" title="Restore"><i class="fas fa-undo"></i></span>` : `<span class="archive-icon" data-id="${conv.id}" title="Archive"><i class="fas fa-archive"></i></span>`}
                    </div>
                `;
            });
            convItems.innerHTML = html;

            // Click on conversation item
            convItems.querySelectorAll('.conv-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    // Ignore clicks on archive/restore icons
                    if (e.target.closest('.archive-icon') || e.target.closest('.restore-icon')) return;
                    const id = el.dataset.id;
                    if (id) selectConversation(id);
                });
            });

            // Archive icon click
            convItems.querySelectorAll('.archive-icon').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = el.dataset.id;
                    if (id) toggleArchive(id);
                });
            });

            // Restore icon click
            convItems.querySelectorAll('.restore-icon').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = el.dataset.id;
                    if (id) toggleArchive(id);
                });
            });
        }

        // ─────────────────────────────────────────────────────────────
        // SELECT CONVERSATION
        // ─────────────────────────────────────────────────────────────
        function selectConversation(convId) {
            if (!convId) return;
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            currentConvId = convId;
            chatName.textContent = 'Admin Support';
            chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
            const isArchived = conv.status === 'archived';
            archiveBtn.style.display = isArchived ? 'none' : 'inline-flex';
            unarchiveBtn.style.display = isArchived ? 'inline-flex' : 'none';
            loadMessages(convId);
            if (conv.unreadCount > 0) {
                updateDoc(doc(db, 'conversations', convId), { unreadCount: 0 });
            }
            renderConvList();
            chatInput.focus();
        }

        // ─────────────────────────────────────────────────────────────
        // LOAD MESSAGES
        // ─────────────────────────────────────────────────────────────
        function loadMessages(convId) {
            if (unsubMessages) unsubMessages();
            const q = query(
                collection(db, 'messages'),
                where('conversationId', '==', convId),
                orderBy('timestamp', 'asc')
            );
            unsubMessages = onSnapshot(q, (snapshot) => {
                const msgs = [];
                snapshot.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                renderMessages(msgs);
                const unread = msgs.filter(m => m.fromUserId === 'admin' && !m.read);
                if (unread.length > 0) {
                    unread.forEach(async (m) => {
                        try {
                            await setDoc(doc(db, 'messages', m.id), { read: true, readAt: serverTimestamp() }, { merge: true });
                        } catch (err) { console.warn('Mark read error:', err); }
                    });
                }
            }, (err) => {
                console.error('Messages error:', err);
                chatMessages.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#ef4444;"></i>
                        <div style="margin-top:12px;color:#ef4444;">Could not load messages</div>
                    </div>`;
            });
        }

        // ─────────────────────────────────────────────────────────────
        // RENDER MESSAGES
        // ─────────────────────────────────────────────────────────────
        function renderMessages(msgs) {
            if (!msgs || msgs.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <div class="title">No messages yet</div>
                        <div class="desc">Start the conversation by sending a message.</div>
                    </div>`;
                scrollBtn.classList.remove('show');
                lastMsgCount = 0;
                return;
            }

            const wasNearBottom = userNearBottom || lastMsgCount === 0;
            const grew = msgs.length > lastMsgCount;
            lastMsgCount = msgs.length;

            let html = '';
            let lastDateKey = '';
            msgs.forEach(m => {
                const isSent = m.fromUserId === currentUser?.uid;
                const ts = m.timestamp?.toDate?.() || null;
                const dateKey = ts ? ts.toDateString() : '';
                const dateLabel = ts ? getDateLabel(ts) : '';
                if (dateLabel && dateKey !== lastDateKey) {
                    html += `<div class="date-sep"><span>${dateLabel}</span></div>`;
                    lastDateKey = dateKey;
                }
                const time = ts ? ts.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
                let statusHtml = '';
                if (isSent) {
                    const read = !!m.read;
                    statusHtml = `<span class="status ${read ? 'read' : 'unread'}">${read ? '✓✓' : '✓'}</span>`;
                }
                const { text, imageUrl } = parseContent(m.content || '');
                let contentHtml = '';
                if (imageUrl) {
                    contentHtml += `
                        <div class="img-wrap" onclick="window.openImageLightbox('${escapeHtml(imageUrl)}')">
                            <img src="${escapeHtml(imageUrl)}" alt="Attachment" loading="lazy" />
                        </div>`;
                }
                if (text) contentHtml += `<span class="text">${escapeHtml(text)}</span>`;
                if (!contentHtml) contentHtml = '<span style="opacity:0.6;">(empty)</span>';

                html += `
                    <div class="msg-row ${isSent ? 'sent' : 'received'}">
                        <div class="msg-bubble">${contentHtml}</div>
                        <div class="msg-meta">
                            <span>${time}</span>
                            ${statusHtml}
                        </div>
                    </div>`;
            });
            chatMessages.innerHTML = html;
            if (wasNearBottom) scrollToBottom(false);
            else if (grew) {
                pendingNewCount += Math.max(1, msgs.length - (lastMsgCount - (grew ? 1 : 0)));
                newCount.textContent = pendingNewCount > 9 ? '9+' : pendingNewCount;
                newCount.classList.add('show');
                scrollBtn.classList.add('show');
            }
        }

        function scrollToBottom(smooth = true) {
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
            userNearBottom = true;
            pendingNewCount = 0;
            newCount.classList.remove('show');
            scrollBtn.classList.remove('show');
        }

        chatMessages.addEventListener('scroll', () => {
            userNearBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 80;
            if (userNearBottom) {
                pendingNewCount = 0;
                newCount.classList.remove('show');
                scrollBtn.classList.remove('show');
            } else {
                scrollBtn.classList.add('show');
            }
        });
        scrollBtn.addEventListener('click', () => scrollToBottom(true));

        // ─────────────────────────────────────────────────────────────
        // SEND MESSAGE
        // ─────────────────────────────────────────────────────────────
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            const hasFile = !!pendingImage;
            if (!text && !hasFile) {
                showToast('Please type a message or attach an image.', 'warning');
                return;
            }
            if (!currentUser) {
                showToast('Please sign in first.', 'warning');
                return;
            }
            if (!currentConvId) {
                const newId = await createConversation();
                if (!newId) return;
            }

            setLoading(sendBtn, true);
            let imageUrl = null;
            try {
                if (hasFile) {
                    imageUrl = await uploadImage(pendingImage);
                    clearImagePreview();
                }
                let content = text;
                if (imageUrl) content = text ? (text + '\n' + imageUrl) : imageUrl;

                await addDoc(collection(db, 'messages'), {
                    conversationId: currentConvId,
                    fromUserId: currentUser.uid,
                    toUserId: 'admin',
                    content,
                    timestamp: serverTimestamp(),
                    read: false,
                });

                await updateDoc(doc(db, 'conversations', currentConvId), {
                    lastMessage: text || '📷 Image',
                    lastMessageTime: serverTimestamp(),
                    unreadCount: 0
                });

                chatInput.value = '';
                autoResize();
                chatInput.focus();
                userNearBottom = true;
                renderConvList();
            } catch (err) {
                console.error('Send error:', err);
                showToast('Error sending message: ' + err.message, 'error');
            } finally {
                setLoading(sendBtn, false);
                if (pendingImage) clearImagePreview();
            }
        });

        // ─────────────────────────────────────────────────────────────
        // CREATE CONVERSATION
        // ─────────────────────────────────────────────────────────────
        async function createConversation() {
            if (!currentUser) return null;
            try {
                const ref = await addDoc(collection(db, 'conversations'), {
                    participants: [currentUser.uid, 'admin'],
                    createdAt: serverTimestamp(),
                    status: 'active',
                    lastMessage: '',
                    lastMessageTime: serverTimestamp(),
                    unreadCount: 0,
                });
                const newId = ref.id;
                // Add to local state
                conversations.unshift({
                    id: newId,
                    participants: [currentUser.uid, 'admin'],
                    createdAt: new Date(),
                    status: 'active',
                    lastMessage: '',
                    lastMessageTime: new Date(),
                    unreadCount: 0,
                });
                currentConvId = newId;
                // Force re-render
                renderConvList();
                selectConversation(newId);
                showToast('New conversation started', 'success');
                return newId;
            } catch (err) {
                console.error('Create conversation error:', err);
                showToast('Error creating conversation: ' + err.message, 'error');
                return null;
            }
        }

        newChatBtn.addEventListener('click', createConversation);

        // ─────────────────────────────────────────────────────────────
        // ARCHIVE / UNARCHIVE (FIXED)
        // ─────────────────────────────────────────────────────────────
        async function toggleArchive(convId) {
            if (!convId) return;
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;

            const newStatus = conv.status === 'active' ? 'archived' : 'active';
            try {
                await updateDoc(doc(db, 'conversations', convId), {
                    status: newStatus,
                    updatedAt: serverTimestamp()
                });
                // Update local state
                conv.status = newStatus;

                // If we archived the currently open conversation
                if (convId === currentConvId) {
                    if (newStatus === 'archived') {
                        // Clear the chat view
                        currentConvId = null;
                        chatMessages.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-archive"></i>
                                <div class="title">Conversation archived</div>
                                <div class="desc">You can view it in the archived tab.</div>
                            </div>`;
                        chatName.textContent = 'Admin Support';
                        chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
                        archiveBtn.style.display = 'none';
                        unarchiveBtn.style.display = 'none';
                        if (unsubMessages) unsubMessages();
                    } else {
                        // Restored - show it
                        selectConversation(convId);
                    }
                }

                // Always re-render the list
                renderConvList();

                showToast(`Conversation ${newStatus === 'archived' ? 'archived' : 'restored'}`, 'success');
            } catch (err) {
                console.error('Archive toggle error:', err);
                showToast('Error: ' + err.message, 'error');
            }
        }

        archiveBtn.addEventListener('click', () => {
            if (currentConvId) toggleArchive(currentConvId);
        });

        unarchiveBtn.addEventListener('click', () => {
            if (currentConvId) toggleArchive(currentConvId);
        });

        // ─────────────────────────────────────────────────────────────
        // FILTER TOGGLE
        // ─────────────────────────────────────────────────────────────
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderConvList();
            });
        });

        // ─────────────────────────────────────────────────────────────
        // AUTO-RESIZE TEXTAREA
        // ─────────────────────────────────────────────────────────────
        function autoResize() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        }
        chatInput.addEventListener('input', autoResize);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        // ─────────────────────────────────────────────────────────────
        // FILE ATTACHMENT
        // ─────────────────────────────────────────────────────────────
        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file.', 'warning');
                fileInput.value = '';
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showToast('Image must be less than 10MB.', 'warning');
                fileInput.value = '';
                return;
            }
            pendingImage = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                imagePreview.classList.add('show');
                fileBtn.querySelector('i').className = 'fas fa-image';
                fileBtn.style.color = '#34C759';
            };
            reader.readAsDataURL(file);
        });

        removePreview.addEventListener('click', clearImagePreview);

        function clearImagePreview() {
            pendingImage = null;
            imagePreview.classList.remove('show');
            previewImg.src = '#';
            fileInput.value = '';
            fileBtn.querySelector('i').className = 'fas fa-image';
            fileBtn.style.color = '';
        }

        // ─────────────────────────────────────────────────────────────
        // LIGHTBOX
        // ─────────────────────────────────────────────────────────────
        window.openImageLightbox = function(url) {
            if (!url) return;
            lbImage.src = url;
            imgLightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        };

        function closeLightbox() {
            imgLightbox.classList.remove('open');
            lbImage.src = '';
            document.body.style.overflow = '';
        }
        lbClose.addEventListener('click', (e) => { e.stopPropagation();
            closeLightbox(); });
        imgLightbox.addEventListener('click', (e) => { if (e.target === imgLightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imgLightbox.classList.contains('open')) closeLightbox();
        });

        // ─────────────────────────────────────────────────────────────
        // QUICK REPLIES
        // ─────────────────────────────────────────────────────────────
        document.querySelectorAll('#quickReplies button').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.dataset.text || '';
                if (!text) return;
                chatInput.value = text;
                autoResize();
                chatInput.focus();
            });
        });

        // ─────────────────────────────────────────────────────────────
        // LISTEN CONVERSATIONS
        // ─────────────────────────────────────────────────────────────
        function listenConversations() {
            if (!currentUser) return;
            if (unsubConversations) unsubConversations();
            const q = query(
                collection(db, 'conversations'),
                where('participants', 'array-contains', currentUser.uid)
            );
            unsubConversations = onSnapshot(q, (snapshot) => {
                const newConvs = [];
                snapshot.forEach(doc => {
                    newConvs.push({ id: doc.id, ...doc.data() });
                });
                conversations = newConvs;
                renderConvList();

                // If current conversation no longer exists, clear it
                if (currentConvId && !conversations.find(c => c.id === currentConvId)) {
                    currentConvId = null;
                    chatMessages.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-comment-dots"></i>
                            <div class="title">Select a conversation</div>
                            <div class="desc">Choose a conversation from the list or start a new one.</div>
                        </div>`;
                    chatName.textContent = 'Admin Support';
                    chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
                    archiveBtn.style.display = 'none';
                    unarchiveBtn.style.display = 'none';
                } else if (currentConvId) {
                    // Update header buttons for current conversation
                    const conv = conversations.find(c => c.id === currentConvId);
                    if (conv) {
                        const isArchived = conv.status === 'archived';
                        archiveBtn.style.display = isArchived ? 'none' : 'inline-flex';
                        unarchiveBtn.style.display = isArchived ? 'inline-flex' : 'none';
                    }
                }
            }, (err) => {
                console.error('Conversations error:', err);
                convItems.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i>Error loading conversations</div>`;
            });
        }

        // ─────────────────────────────────────────────────────────────
        // AUTH
        // ─────────────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
            updateNavbarAuth(user, displayName);
            listenConversations();

            const params = new URLSearchParams(window.location.search);
            const convId = params.get('conv');
            if (convId) {
                setTimeout(() => {
                    const exists = conversations.find(c => c.id === convId);
                    if (exists) selectConversation(convId);
                }, 500);
            } else {
                setTimeout(() => {
                    const active = conversations.find(c => c.status === 'active');
                    if (active) selectConversation(active.id);
                }, 500);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (unsubMessages) unsubMessages();
            if (unsubConversations) unsubConversations();
        });

        console.log('✅ Support Chat — archive fixed, image support added');
    </script>
</body>
</html>
