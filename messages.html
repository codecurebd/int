<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Support Messages | CodeCureBD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="style.css" />

    <style>
        /* ─────────────────────────────────────────────
           MAIN STYLES – same base, enhanced for new UI
           ───────────────────────────────────────────── */
        * { box-sizing: border-box; }
        body {
            background: #f0f4f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        @font-face { font-family: 'Inter'; font-display: swap; }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            padding-top: 72px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 !important;
        }
        .chat-full-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 960px;
            margin: 16px auto;
            padding: 12px 16px 16px !important;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .messenger-wrap {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        /* ─── Chat List ─── */
        .chat-list {
            width: 300px;
            border-right: 1px solid rgba(0, 0, 0, 0.06);
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-list-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .chat-list-header .title {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.05rem;
        }
        .chat-list-header .actions {
            display: flex;
            gap: 6px;
        }
        .chat-list-header .actions button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .chat-list-header .actions button:hover {
            background: rgba(0, 102, 255, 0.08);
            color: #0066FF;
        }
        .chat-list-header .actions button.active {
            background: rgba(0, 102, 255, 0.12);
            color: #0066FF;
        }

        .chat-list-filter {
            display: flex;
            padding: 6px 16px;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
        }
        .chat-list-filter button {
            flex: 1;
            padding: 6px 0;
            border: none;
            background: none;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .chat-list-filter button.active {
            background: rgba(0, 102, 255, 0.08);
            color: #0066FF;
        }
        .chat-list-filter button:hover {
            color: #0f172a;
        }

        .chat-list-items {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .chat-list-items .empty {
            padding: 2rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.15s;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .chat-item:hover {
            background: rgba(0, 102, 255, 0.04);
        }
        .chat-item.active {
            background: rgba(0, 102, 255, 0.08);
            border-left: 3px solid #0066FF;
        }
        .chat-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .info .name {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .chat-item .info .name .time {
            font-weight: 400;
            font-size: 0.65rem;
            color: #94a3b8;
        }
        .chat-item .info .last-msg {
            font-size: 0.78rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .unread-badge {
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            border-radius: 40px;
            padding: 0 8px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 18px;
            min-width: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ─── Chat Main ─── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .chat-main .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(248,250,252,0.85) 100%);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .chat-main .chat-header .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .chat-main .chat-header .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-main .chat-header .chat-info .name {
            font-weight: 700;
            color: #0f172a;
            font-size: 1rem;
        }
        .chat-main .chat-header .chat-info .status {
            font-size: 0.72rem;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-main .chat-header .chat-info .status .dot {
            width: 7px;
            height: 7px;
            background: #34C759;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }
        .chat-header-actions {
            display: flex;
            gap: 6px;
        }
        .chat-header-actions button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .chat-header-actions button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #0f172a;
        }
        .chat-header-actions .archive-btn {
            color: #ef4444;
        }
        .chat-header-actions .archive-btn:hover {
            background: rgba(239, 68, 68, 0.08);
            color: #dc2626;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0, 102, 255, 0.03), transparent 60%), #f8fafc;
            scroll-behavior: smooth;
            position: relative;
        }

        .date-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 14px 0 10px;
            gap: 12px;
        }
        .date-separator::before, .date-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
            max-width: 80px;
        }
        .date-separator span {
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: min(85%, 520px);
            margin-bottom: 2px;
        }
        .msg-row.sent { align-self: flex-end; margin-left: auto; }
        .msg-row.received { align-self: flex-start; margin-right: auto; }

        .chat-msg {
            display: block;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: normal;
        }
        .msg-row.sent .chat-msg {
            background: linear-gradient(135deg, #0066FF 0%, #5856D6 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 10px rgba(0, 102, 255, 0.16);
        }
        .msg-row.received .chat-msg {
            background: #ffffff;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            padding: 11px 16px;
        }
        .chat-msg .msg-text {
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: break-word;
        }
        .chat-msg .msg-img-wrap {
            margin: 0 0 4px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            max-width: 240px;
            position: relative;
        }
        .chat-msg .msg-img-wrap:hover img { transform: scale(1.02); }
        .chat-msg .msg-img-wrap::after {
            content: '\f00e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.45);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .chat-msg .msg-img-wrap:hover::after { opacity: 1; }
        .chat-msg .msg-img-wrap img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 3px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .msg-row.sent .msg-meta { justify-content: flex-end; }
        .msg-meta .msg-status {
            font-size: 0.7rem;
            letter-spacing: -1px;
            margin-left: 1px;
        }
        .msg-meta .msg-status.read { color: #0066FF; }
        .msg-meta .msg-status.unread { color: #94a3b8; opacity: 0.8; }

        .scroll-bottom-btn {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            color: #0066FF;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .scroll-bottom-btn.show { display: flex; animation: fadeUp 0.25s ease; }
        .scroll-bottom-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(0, 102, 255, 0.2);
        }
        .scroll-bottom-btn .new-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #FF3B30;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .scroll-bottom-btn .new-count.show { display: flex; }

        .quick-replies {
            display: flex;
            gap: 8px;
            padding: 0 16px 10px;
            overflow-x: auto;
            flex-shrink: 0;
            background: rgba(248, 250, 252, 0.9);
            scrollbar-width: none;
        }
        .quick-replies::-webkit-scrollbar { display: none; }
        .quick-replies button {
            flex-shrink: 0;
            background: #fff;
            border: 1.5px solid rgba(0, 102, 255, 0.12);
            color: #0066FF;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quick-replies button:hover {
            background: rgba(0, 102, 255, 0.06);
            border-color: #0066FF;
            transform: translateY(-1px);
        }

        .chat-input-wrap {
            padding: 12px 16px 14px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            align-items: flex-end;
        }
        .chat-input-wrap .input-wrapper {
            flex: 1;
            display: flex;
            gap: 6px;
            align-items: flex-end;
            background: #f1f5f9;
            border-radius: 24px;
            border: 1.5px solid transparent;
            padding: 6px 8px 6px 16px;
            transition: all 0.2s ease;
            min-height: 48px;
        }
        .chat-input-wrap .input-wrapper:focus-within {
            border-color: #0066FF;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.08);
        }
        .chat-input-wrap .input-wrapper textarea {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
            resize: none;
            max-height: 120px;
            line-height: 1.45;
            font-family: inherit;
            color: #1e293b;
        }
        .chat-input-wrap .input-wrapper textarea::placeholder { color: #94a3b8; opacity: 1; }

        .chat-input-wrap .file-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.2s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
            position: relative;
            overflow: hidden;
        }
        .chat-input-wrap .file-btn:hover {
            color: #0066FF;
            background: rgba(0, 102, 255, 0.08);
        }
        .chat-input-wrap .file-btn input[type="file"] { display: none; }

        .chat-input-wrap .image-preview {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 102, 255, 0.06);
            border-radius: 16px;
            padding: 4px 10px 4px 4px;
            margin-right: 2px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 102, 255, 0.1);
        }
        .chat-input-wrap .image-preview.show { display: flex; }
        .chat-input-wrap .image-preview img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .chat-input-wrap .image-preview .remove-preview {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
            border-radius: 50%;
            transition: 0.15s;
        }
        .chat-input-wrap .image-preview .remove-preview:hover { color: #FF3B30; background: rgba(255, 59, 48, 0.08); }
        .chat-input-wrap .send-btn {
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.28);
        }
        .chat-input-wrap .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 22px rgba(0, 102, 255, 0.38);
        }
        .chat-input-wrap .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 0.95rem;
            flex-direction: column;
            gap: 8px;
            padding: 2rem;
            text-align: center;
        }
        .empty-state .empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.08), rgba(139, 92, 246, 0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .empty-state .empty-icon i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .empty-state .empty-title { font-weight: 700; color: #334155; font-size: 1.05rem; }
        .empty-state .empty-desc { font-size: 0.85rem; color: #94a3b8; max-width: 260px; line-height: 1.5; }

        .img-lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            cursor: zoom-out;
        }
        .img-lightbox.open { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .img-lightbox img {
            max-width: 95vw;
            max-height: 88vh;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            object-fit: contain;
        }
        .img-lightbox .lb-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .img-lightbox .lb-close:hover { background: rgba(255, 255, 255, 0.25); }

        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #0066FF;
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }
        .toast.success { border-left-color: #22c55e; }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.hide { opacity: 0; transform: translateX(30px); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .chat-list { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.06); }
            .chat-full-section { border-radius: 14px; }
            .page-wrapper { padding-top: 66px; }
            .messenger-wrap { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .page-wrapper { padding-top: 60px; }
            .chat-item { padding: 10px 12px; }
            .chat-item .avatar { width: 36px; height: 36px; font-size: 0.8rem; }
            .chat-item .info .name { font-size: 0.8rem; }
            .chat-item .info .last-msg { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div id="navbar-placeholder"></div>

        <main class="main-content">
            <section class="chat-full-section">
                <div class="messenger-wrap">
                    <!-- Chat List -->
                    <div class="chat-list" id="chatList">
                        <div class="chat-list-header">
                            <span class="title">Conversations</span>
                            <div class="actions">
                                <button id="newChatBtn" title="New conversation"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <div class="chat-list-filter">
                            <button class="active" data-filter="active">Active</button>
                            <button data-filter="archived">Archived</button>
                        </div>
                        <div class="chat-list-items" id="chatListItems">
                            <div class="empty">Loading conversations…</div>
                        </div>
                    </div>

                    <!-- Chat Main -->
                    <div class="chat-main" id="chatMain">
                        <div class="chat-header" id="chatHeader">
                            <div class="chat-avatar" id="chatAvatar">
                                <i class="fas fa-headset"></i>
                            </div>
                            <div class="chat-info">
                                <div class="name" id="chatName">Admin Support</div>
                                <div class="status"><span class="dot"></span> Online</div>
                            </div>
                            <div class="chat-header-actions">
                                <button id="archiveChatBtn" class="archive-btn" title="Archive conversation">
                                    <i class="fas fa-archive"></i>
                                </button>
                            </div>
                        </div>

                        <div class="chat-messages" id="chatMessages">
                            <div class="empty-state">
                                <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
                                <div class="empty-title">Select a conversation</div>
                                <div class="empty-desc">Choose a conversation from the list or start a new one.</div>
                            </div>
                        </div>

                        <button type="button" class="scroll-bottom-btn" id="scrollBottomBtn">
                            <i class="fas fa-chevron-down"></i>
                            <span class="new-count" id="newMsgCount">0</span>
                        </button>

                        <div class="quick-replies" id="quickReplies">
                            <button data-text="Hi, I need help with my order.">📦 Order help</button>
                            <button data-text="I have a payment / transaction question.">💳 Payment</button>
                            <button data-text="I need a website fix / repair.">🔧 Website fix</button>
                            <button data-text="Thanks for your help!">🙏 Thank you</button>
                        </div>

                        <form class="chat-input-wrap" id="chatForm">
                            <div class="input-wrapper">
                                <textarea id="chatInput" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
                                <div class="image-preview" id="imagePreview">
                                    <img id="previewImg" src="#" alt="preview" />
                                    <button type="button" class="remove-preview" id="removePreview" title="Remove image">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <label class="file-btn" id="fileBtn" title="Attach image">
                                    <i class="fas fa-image"></i>
                                    <input type="file" id="fileInput" accept="image/*" />
                                </label>
                            </div>
                            <button type="submit" class="send-btn" id="chatSendBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <!-- Image Lightbox -->
    <div class="img-lightbox" id="imgLightbox" role="dialog" aria-label="Image preview">
        <button type="button" class="lb-close" id="lbClose" aria-label="Close">&times;</button>
        <img id="lbImage" src="" alt="Full size" />
    </div>

    <div id="toast-container"></div>

    <script type="module">
        // ─────────────────────────────────────────────────────────────
        // IMPORTS
        // ─────────────────────────────────────────────────────────────
        import {
            auth, db, collection, doc, getDoc, setDoc, addDoc, onSnapshot,
            query, where, serverTimestamp, onAuthStateChanged, updateDoc,
            deleteDoc, getDocs
        } from './firebase-config.js';
        import {
            renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
            renderCartSidebar, setLoading, renderPaymentModal, uploadImage,
            renderAuthModal
        } from './components.js';

        renderNavbar();
        renderAuthModal();
        renderFooter();
        renderCartSidebar();
        renderPaymentModal();
        updateCartBadge();

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400); }, 4500);
        };

        // ─────────────────────────────────────────────────────────────
        // CHAT STATE
        // ─────────────────────────────────────────────────────────────
        let currentUser = null;
        let conversations = [];           // all conversations (active + archived)
        let currentConversationId = null;
        let unsubMessages = null;
        let unsubConversations = null;
        let pendingImageFile = null;
        let userNearBottom = true;
        let pendingNewCount = 0;
        let lastMsgCount = 0;
        let currentFilter = 'active';     // 'active' or 'archived'

        // DOM refs
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const fileInput = document.getElementById('fileInput');
        const fileBtn = document.getElementById('fileBtn');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removePreviewBtn = document.getElementById('removePreview');
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');
        const newMsgCountEl = document.getElementById('newMsgCount');
        const imgLightbox = document.getElementById('imgLightbox');
        const lbImage = document.getElementById('lbImage');
        const lbClose = document.getElementById('lbClose');
        const chatListItems = document.getElementById('chatListItems');
        const chatName = document.getElementById('chatName');
        const chatAvatar = document.getElementById('chatAvatar');
        const archiveBtn = document.getElementById('archiveChatBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const filterBtns = document.querySelectorAll('.chat-list-filter button');

        // ─────────────────────────────────────────────────────────────
        // HELPERS
        // ─────────────────────────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function isImageUrl(str) {
            if (!str) return false;
            return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?.*)?$/i.test(str.trim()) ||
                str.includes('res.cloudinary.com');
        }

        function getConversationDisplayName(conv) {
            // For now, all are with admin, but we could show user name if multiple participants
            return 'Admin Support';
        }

        function getConversationAvatar(conv) {
            return 'A';
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
            if (diff < 86400000) return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            if (diff < 604800000) return date.toLocaleDateString('en-US', { weekday: 'short' });
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // ─────────────────────────────────────────────────────────────
        // RENDER CONVERSATION LIST
        // ─────────────────────────────────────────────────────────────
        function renderConversationList() {
            const filtered = conversations.filter(c => c.status === currentFilter);
            if (filtered.length === 0) {
                chatListItems.innerHTML = `<div class="empty">No ${currentFilter} conversations</div>`;
                return;
            }
            // Sort by lastMessageTime (newest first)
            filtered.sort((a, b) => {
                const ta = a.lastMessageTime?.toDate?.()?.getTime() || 0;
                const tb = b.lastMessageTime?.toDate?.()?.getTime() || 0;
                return tb - ta;
            });

            let html = '';
            filtered.forEach(conv => {
                const isActive = conv.id === currentConversationId;
                const name = getConversationDisplayName(conv);
                const avatar = getConversationAvatar(conv);
                const lastMsg = conv.lastMessage || 'No messages yet';
                const time = formatTime(conv.lastMessageTime);
                const unread = conv.unreadCount || 0;
                html += `
                    <div class="chat-item ${isActive ? 'active' : ''}" data-id="${conv.id}">
                        <div class="avatar">${avatar}</div>
                        <div class="info">
                            <div class="name">
                                <span>${name}</span>
                                <span class="time">${time}</span>
                            </div>
                            <div class="last-msg">${escapeHtml(lastMsg)}</div>
                        </div>
                        ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                    </div>
                `;
            });
            chatListItems.innerHTML = html;

            // Click handlers
            chatListItems.querySelectorAll('.chat-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    if (id) selectConversation(id);
                });
            });
        }

        // ─────────────────────────────────────────────────────────────
        // SELECT CONVERSATION
        // ─────────────────────────────────────────────────────────────
        function selectConversation(convId) {
            if (!convId) return;
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            currentConversationId = convId;
            // Update header
            chatName.textContent = getConversationDisplayName(conv);
            chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
            // Load messages
            loadMessages(convId);
            // Mark as read (reset unread)
            if (conv.unreadCount > 0) {
                updateDoc(doc(db, 'conversations', convId), { unreadCount: 0 });
            }
            renderConversationList();
            // Show archive button only for active conversations
            archiveBtn.style.display = conv.status === 'active' ? 'inline-flex' : 'none';
            // Focus input
            chatInput.focus();
        }

        // ─────────────────────────────────────────────────────────────
        // LOAD MESSAGES
        // ─────────────────────────────────────────────────────────────
        function loadMessages(convId) {
            if (unsubMessages) unsubMessages();
            const q = query(
                collection(db, 'messages'),
                where('conversationId', '==', convId)
            );
            unsubMessages = onSnapshot(q, (snapshot) => {
                const msgs = [];
                snapshot.forEach(d => {
                    msgs.push({ id: d.id, ...d.data() });
                });
                msgs.sort((a, b) => (a.timestamp?.toDate?.()?.getTime() || 0) - (b.timestamp?.toDate?.()?.getTime() || 0));
                renderMessages(msgs);
                // Mark incoming messages as read
                const unread = msgs.filter(m => m.fromUserId === 'admin' && !m.read);
                if (unread.length > 0) {
                    unread.forEach(async (m) => {
                        try {
                            await setDoc(doc(db, 'messages', m.id), { read: true, readAt: serverTimestamp() }, { merge: true });
                        } catch (err) { console.warn('Mark read error:', err); }
                    });
                }
            }, (error) => {
                console.error('Messages snapshot error:', error);
                chatMessages.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#ef4444;"></i>
                        <div style="margin-top:12px;color:#ef4444;">Could not load messages</div>
                    </div>
                `;
            });
        }

        // ─────────────────────────────────────────────────────────────
        // RENDER MESSAGES
        // ─────────────────────────────────────────────────────────────
        function renderMessages(msgs) {
            if (!msgs || msgs.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-dots" style="font-size:3rem;color:#e2e8f0;margin-bottom:16px;"></i>
                        <div style="font-weight:600;color:#64748b;">No messages yet</div>
                        <div style="font-size:0.9rem;color:#94a3b8;margin-top:8px;">Start the conversation</div>
                    </div>
                `;
                scrollBottomBtn.classList.remove('show');
                lastMsgCount = 0;
                return;
            }

            const wasNearBottom = userNearBottom || lastMsgCount === 0;
            const grew = msgs.length > lastMsgCount;
            lastMsgCount = msgs.length;

            let html = '';
            let lastDateKey = '';
            msgs.forEach(m => {
                const isSent = m.fromUserId === currentUser?.uid;
                const ts = m.timestamp?.toDate?.() || null;
                const dateKey = ts ? ts.toDateString() : '';
                const dateLabel = ts ? getDateLabel(ts) : '';
                if (dateLabel && dateKey !== lastDateKey) {
                    html += `<div class="date-separator"><span>${dateLabel}</span></div>`;
                    lastDateKey = dateKey;
                }
                const time = ts ? ts.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
                let statusHtml = '';
                if (isSent) {
                    const read = !!m.read;
                    statusHtml = `<span class="msg-status ${read ? 'read' : 'unread'}">${read ? '✓✓' : '✓'}</span>`;
                }
                const { text, imageUrl } = parseMessageContent(m.content || '');
                let contentHtml = '';
                if (imageUrl) {
                    contentHtml += `
                        <div class="msg-img-wrap" onclick="window.openImageLightbox('${escapeHtml(imageUrl)}')">
                            <img src="${escapeHtml(imageUrl)}" alt="Attachment" loading="lazy" />
                        </div>`;
                }
                if (text) {
                    contentHtml += `<span class="msg-text">${escapeHtml(text)}</span>`;
                }
                if (!contentHtml) contentHtml = '<span class="msg-text" style="opacity:0.6;">(empty)</span>';
                const imgOnly = imageUrl && !text ? ' img-only' : '';
                html += `
                    <div class="msg-row ${isSent ? 'sent' : 'received'}">
                        <div class="chat-msg${imgOnly}">${contentHtml}</div>
                        <div class="msg-meta">
                            <span class="msg-time">${time}</span>
                            ${statusHtml}
                        </div>
                    </div>
                `;
            });
            chatMessages.innerHTML = html;
            if (wasNearBottom) scrollToBottom(false);
            else if (grew) {
                pendingNewCount += Math.max(1, msgs.length - (lastMsgCount - (grew ? 1 : 0)));
                newMsgCountEl.textContent = pendingNewCount > 9 ? '9+' : pendingNewCount;
                newMsgCountEl.classList.add('show');
                scrollBottomBtn.classList.add('show');
            }
        }

        function getDateLabel(date) {
            if (!date || isNaN(date.getTime())) return '';
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.round((today - msgDay) / 86400000);
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return date.toLocaleDateString('en-US', { weekday: 'long' });
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
        }

        function parseMessageContent(content) {
            const raw = content || '';
            const lines = raw.split('\n');
            let textParts = [];
            let imageUrl = null;
            lines.forEach(line => {
                const t = line.trim();
                if (isImageUrl(t)) {
                    imageUrl = t;
                } else if (t) {
                    textParts.push(line);
                }
            });
            if (!imageUrl && isImageUrl(raw.trim())) {
                imageUrl = raw.trim();
                textParts = [];
            }
            return { text: textParts.join('\n'), imageUrl };
        }

        // ─────────────────────────────────────────────────────────────
        // SCROLL HELPERS
        // ─────────────────────────────────────────────────────────────
        function isNearBottom(threshold = 80) {
            return chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < threshold;
        }

        function scrollToBottom(smooth = true) {
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
            userNearBottom = true;
            pendingNewCount = 0;
            newMsgCountEl.classList.remove('show');
            scrollBottomBtn.classList.remove('show');
        }

        chatMessages.addEventListener('scroll', () => {
            userNearBottom = isNearBottom();
            if (userNearBottom) {
                pendingNewCount = 0;
                newMsgCountEl.classList.remove('show');
                scrollBottomBtn.classList.remove('show');
            } else {
                scrollBottomBtn.classList.add('show');
            }
        });

        scrollBottomBtn.addEventListener('click', () => scrollToBottom(true));

        // ─────────────────────────────────────────────────────────────
        // SEND MESSAGE
        // ─────────────────────────────────────────────────────────────
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            const hasFile = !!pendingImageFile;
            if (!text && !hasFile) {
                showToast('Please type a message or attach an image.', 'warning');
                return;
            }
            if (!currentUser) return;
            if (!currentConversationId) {
                // Create a new conversation automatically
                await createNewConversation();
                if (!currentConversationId) {
                    showToast('Could not create conversation.', 'error');
                    return;
                }
            }

            setLoading(chatSendBtn, true);
            let imageUrl = null;
            try {
                if (hasFile) {
                    imageUrl = await uploadImage(pendingImageFile);
                    clearImagePreview();
                }
                let finalContent = text;
                if (imageUrl) finalContent = text ? (text + '\n' + imageUrl) : imageUrl;

                await addDoc(collection(db, 'messages'), {
                    conversationId: currentConversationId,
                    fromUserId: currentUser.uid,
                    toUserId: 'admin',
                    content: finalContent,
                    timestamp: serverTimestamp(),
                    read: false,
                });

                // Update conversation last message
                await updateDoc(doc(db, 'conversations', currentConversationId), {
                    lastMessage: text || 'Image',
                    lastMessageTime: serverTimestamp(),
                    unreadCount: 0 // user already read their own message
                });

                chatInput.value = '';
                autoResizeTextarea();
                chatInput.focus();
                userNearBottom = true;
                // Optimistically update list
                renderConversationList();
            } catch (err) {
                console.error('Send error:', err);
                showToast('Error sending message: ' + err.message, 'error');
            } finally {
                setLoading(chatSendBtn, false);
                if (pendingImageFile) clearImagePreview();
            }
        });

        // ─────────────────────────────────────────────────────────────
        // CREATE NEW CONVERSATION
        // ─────────────────────────────────────────────────────────────
        async function createNewConversation() {
            if (!currentUser) return;
            try {
                const docRef = await addDoc(collection(db, 'conversations'), {
                    participants: [currentUser.uid, 'admin'],
                    createdAt: serverTimestamp(),
                    status: 'active',
                    lastMessage: '',
                    lastMessageTime: serverTimestamp(),
                    unreadCount: 0,
                });
                const newId = docRef.id;
                // Add to local conversations list
                const newConv = {
                    id: newId,
                    participants: [currentUser.uid, 'admin'],
                    createdAt: new Date(),
                    status: 'active',
                    lastMessage: '',
                    lastMessageTime: new Date(),
                    unreadCount: 0,
                };
                conversations.unshift(newConv);
                currentConversationId = newId;
                selectConversation(newId);
                renderConversationList();
                showToast('New conversation started', 'success');
                return newId;
            } catch (err) {
                console.error('Create conversation error:', err);
                showToast('Error creating conversation: ' + err.message, 'error');
                return null;
            }
        }

        // ─────────────────────────────────────────────────────────────
        // ARCHIVE / UNARCHIVE CONVERSATION
        // ─────────────────────────────────────────────────────────────
        async function archiveConversation(convId) {
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            const newStatus = conv.status === 'active' ? 'archived' : 'active';
            try {
                await updateDoc(doc(db, 'conversations', convId), { status: newStatus });
                conv.status = newStatus;
                if (newStatus === 'archived' && convId === currentConversationId) {
                    // Close the chat view
                    currentConversationId = null;
                    chatMessages.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-archive"></i></div>
                            <div class="empty-title">Conversation archived</div>
                            <div class="empty-desc">You can view it in the archived tab.</div>
                        </div>
                    `;
                    chatName.textContent = 'Admin Support';
                    chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
                    archiveBtn.style.display = 'none';
                }
                renderConversationList();
                showToast(`Conversation ${newStatus === 'archived' ? 'archived' : 'restored'}`, 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            }
        }

        archiveBtn.addEventListener('click', () => {
            if (currentConversationId) {
                archiveConversation(currentConversationId);
            }
        });

        // ─────────────────────────────────────────────────────────────
        // NEW CHAT
        // ─────────────────────────────────────────────────────────────
        newChatBtn.addEventListener('click', async () => {
            // Check if there's an active conversation already – we can allow multiple, so just create new
            await createNewConversation();
        });

        // ─────────────────────────────────────────────────────────────
        // FILTER TOGGLE
        // ─────────────────────────────────────────────────────────────
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderConversationList();
            });
        });

        // ─────────────────────────────────────────────────────────────
        // AUTO-RESIZE TEXTAREA
        // ─────────────────────────────────────────────────────────────
        function autoResizeTextarea() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        }
        chatInput.addEventListener('input', autoResizeTextarea);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        // ─────────────────────────────────────────────────────────────
        // FILE ATTACHMENT
        // ─────────────────────────────────────────────────────────────
        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file.', 'warning');
                fileInput.value = '';
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showToast('Image must be less than 10MB.', 'warning');
                fileInput.value = '';
                return;
            }
            pendingImageFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                imagePreview.classList.add('show');
                fileBtn.querySelector('i').className = 'fas fa-image';
                fileBtn.style.color = '#34C759';
            };
            reader.readAsDataURL(file);
        });

        removePreviewBtn.addEventListener('click', () => {
            pendingImageFile = null;
            imagePreview.classList.remove('show');
            previewImg.src = '#';
            fileInput.value = '';
            fileBtn.querySelector('i').className = 'fas fa-image';
            fileBtn.style.color = '';
        });

        function clearImagePreview() {
            pendingImageFile = null;
            imagePreview.classList.remove('show');
            previewImg.src = '#';
            fileInput.value = '';
            fileBtn.querySelector('i').className = 'fas fa-image';
            fileBtn.style.color = '';
        }

        // ─────────────────────────────────────────────────────────────
        // LIGHTBOX
        // ─────────────────────────────────────────────────────────────
        window.openImageLightbox = function(url) {
            if (!url) return;
            lbImage.src = url;
            imgLightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        };

        function closeLightbox() {
            imgLightbox.classList.remove('open');
            lbImage.src = '';
            document.body.style.overflow = '';
        }
        lbClose.addEventListener('click', (e) => { e.stopPropagation();
            closeLightbox(); });
        imgLightbox.addEventListener('click', (e) => { if (e.target === imgLightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imgLightbox.classList.contains('open')) closeLightbox();
        });

        // ─────────────────────────────────────────────────────────────
        // QUICK REPLIES
        // ─────────────────────────────────────────────────────────────
        document.getElementById('quickReplies').querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.dataset.text || '';
                if (!text) return;
                chatInput.value = text;
                autoResizeTextarea();
                chatInput.focus();
            });
        });

        // ─────────────────────────────────────────────────────────────
        // LISTEN CONVERSATIONS (REAL-TIME)
        // ─────────────────────────────────────────────────────────────
        function listenConversations() {
            if (!currentUser) return;
            if (unsubConversations) unsubConversations();
            const q = query(
                collection(db, 'conversations'),
                where('participants', 'array-contains', currentUser.uid)
            );
            unsubConversations = onSnapshot(q, (snapshot) => {
                conversations = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    conversations.push({
                        id: doc.id,
                        ...data,
                    });
                });
                renderConversationList();
                // If currentConversationId is not in the list, clear it
                if (currentConversationId && !conversations.find(c => c.id === currentConversationId)) {
                    currentConversationId = null;
                    chatMessages.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
                            <div class="empty-title">Select a conversation</div>
                            <div class="empty-desc">Choose a conversation from the list or start a new one.</div>
                        </div>
                    `;
                    chatName.textContent = 'Admin Support';
                    chatAvatar.innerHTML = `<i class="fas fa-headset"></i>`;
                    archiveBtn.style.display = 'none';
                }
            }, (error) => {
                console.error('Conversations snapshot error:', error);
                chatListItems.innerHTML = `<div class="empty">Error loading conversations</div>`;
            });
        }

        // ─────────────────────────────────────────────────────────────
        // AUTH STATE
        // ─────────────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
            updateNavbarAuth(user, displayName);

            // Start listening
            listenConversations();

            // If there's a conversation ID in URL param, select it
            const params = new URLSearchParams(window.location.search);
            const convId = params.get('conv');
            if (convId) {
                // Wait a bit for conversations to load
                setTimeout(() => {
                    const exists = conversations.find(c => c.id === convId);
                    if (exists) selectConversation(convId);
                }, 500);
            } else {
                // Auto-select first active conversation if any
                setTimeout(() => {
                    const active = conversations.find(c => c.status === 'active');
                    if (active) selectConversation(active.id);
                }, 500);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (unsubMessages) unsubMessages();
            if (unsubConversations) unsubConversations();
        });

        console.log('✅ messages.html – full professional messaging system with archiving');
    </script>
</body>
</html>
