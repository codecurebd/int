<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Admin Login – CodeCureBD</title>
  
  <!-- ✅ Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #eef2f7 0%, #f0f4f9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ===== GLASS CARD (Enhanced) ===== */
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
      border-radius: 32px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      transition: all 0.3s ease;
    }
    .glass:hover {
      box-shadow: 0 30px 80px rgba(0, 102, 255, 0.08);
    }

    /* ===== BUTTON ===== */
    .btn-primary {
      background: linear-gradient(135deg, #0066FF, #8B5CF6);
      color: #fff;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 102, 255, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0, 102, 255, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ===== FORM INPUT ===== */
    .form-input {
      width: 100%;
      padding: 14px 20px;
      border: 1.5px solid rgba(0, 102, 255, 0.08);
      border-radius: 16px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      outline: none;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
    }
    .form-input:focus {
      border-color: #0066FF;
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.08);
      background: #ffffff;
    }
    .form-input::placeholder {
      color: #8e8e93;
      opacity: 0.7;
    }
    .form-input.error {
      border-color: #FF3B30;
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.08);
    }

    /* ===== SPINNER ===== */
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== TOGGLE PASSWORD ===== */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      transition: 0.2s;
    }
    .toggle-password:hover {
      color: #0066FF;
    }

    /* ===== CHECKBOX ===== */
    .custom-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #0066FF;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .glass { padding: 1.5rem; border-radius: 24px; }
      .btn-primary { font-size: 0.95rem; min-height: 48px; padding: 12px 20px; }
      .form-input { padding: 12px 16px; font-size: 0.95rem; border-radius: 14px; }
    }
</style>
</head>
<body>
  <div class="glass">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center mx-auto shadow-lg shadow-blue-500/20">
        <i class="fas fa-shield-alt text-2xl text-white"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mt-4">Admin Login</h2>
      <p class="text-sm text-gray-500 mt-1">Access the admin dashboard</p>
    </div>

    <!-- Form -->
    <form id="adminLoginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@example.com" required class="form-input" autocomplete="email" />
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="adminPassword" placeholder="••••••••" required class="form-input pr-12" autocomplete="current-password" />
          <button type="button" onclick="togglePassword()" class="toggle-password" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
          <input type="checkbox" id="rememberMe" class="custom-checkbox" />
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn-primary">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>

      <div id="adminLoginError" class="text-red-500 text-sm hidden text-center p-3 bg-red-50 rounded-xl border border-red-200"></div>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400 border-t border-gray-200/50 pt-4">
      <p>Authorized admin access only</p>
    </div>
  </div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, onAuthStateChanged, doc, getDoc } from './firebase-config.js';
    import { setLoading } from './components.js';

    // ===== Toggle Password =====
    window.togglePassword = () => {
      const input = document.getElementById('adminPassword');
      const icon = document.getElementById('toggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    };

    // ===== Auto-redirect if already logged in =====
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists() && userDoc.data().role === 'admin') {
            window.location.href = 'admin-panel.html';
          } else {
            await auth.signOut();
          }
        } catch (err) {
          console.error(err);
        }
      }
    });

    // ===== Login Form Submit =====
    const loginForm = document.getElementById('adminLoginForm');
    const loginBtn = loginForm.querySelector('button[type="submit"]');
    const errorDiv = document.getElementById('adminLoginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const remember = document.getElementById('rememberMe').checked;

      // Clear previous error
      errorDiv.classList.add('hidden');
      errorDiv.textContent = '';
      document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

      // Basic validation
      if (!email || !password) {
        errorDiv.textContent = '⚠️ Please fill in all fields.';
        errorDiv.classList.remove('hidden');
        if (!email) document.getElementById('adminEmail').classList.add('error');
        if (!password) document.getElementById('adminPassword').classList.add('error');
        return;
      }

      setLoading(loginBtn, true, 'Logging in...');

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        const user = userCred.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));

        if (userDoc.exists() && userDoc.data().role === 'admin') {
          if (remember) {
            localStorage.setItem('adminRemember', 'true');
          } else {
            localStorage.removeItem('adminRemember');
          }
          window.location.href = 'admin-panel.html';
        } else {
          await auth.signOut();
          errorDiv.textContent = '❌ You do not have admin permission.';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = '⚠️ ' + err.message;
        errorDiv.classList.remove('hidden');
        document.getElementById('adminPassword').classList.add('error');
      } finally {
        setLoading(loginBtn, false);
      }
    });

    // ===== Remove error state on focus =====
    document.querySelectorAll('.form-input').forEach(el => {
      el.addEventListener('focus', () => el.classList.remove('error'));
    });
  </script>
</body>
</html>
